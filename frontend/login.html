<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marauder - Connexion | Plateforme CSINT</title>
    <link rel="icon" type="image/png" href="hydra.png">
    <link rel="shortcut icon" type="image/png" href="hydra.png">
    <meta property="og:title" content="Marauder - Connexion | Plateforme CSINT">
    <meta property="og:description" content="Connectez-vous à la plateforme d'investigation Marauder.">
    <meta property="og:image" content="hydra.png">
    <meta property="og:url" content="https://marauder.host/login">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Marauder">
    <style>
        /* ============================================
        RESET & BASE — STYLE LANDING ROUGE
        ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #050202;
            --glass-1: rgba(255,255,255,0.035);
            --glass-2: rgba(255,255,255,0.055);
            --glass-3: rgba(255,255,255,0.08);
            --stroke-1: rgba(220,38,38,0.12);
            --stroke-2: rgba(220,38,38,0.25);
            --stroke-3: rgba(220,38,38,0.4);
            --text-1: #ffffff;
            --text-2: #a8a8a8;
            --text-3: #6a6a6a;
            --text-4: #3a3a3a;
            --success: #10b981;
            --danger: #ef4444;
            --warn: #f59e0b;
            --red: #dc2626;
            --red-dark: #7f1d1d;
            --red-light: #f87171;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Arial, sans-serif;
            background: var(--bg-deep);
            color: var(--text-1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* AURA ROUGE — style landing */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(220,38,38,0.14), transparent 60%),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(127,29,29,0.1), transparent 60%),
                radial-gradient(ellipse 40% 30% at 15% 50%, rgba(220,38,38,0.05), transparent 70%),
                radial-gradient(ellipse 40% 30% at 85% 50%, rgba(127,29,29,0.05), transparent 70%);
            z-index: -3;
            pointer-events: none;
        }

        /* Halo central pulsant */
        body::after {
            content: '';
            position: fixed;
            top: -30%; left: 50%;
            transform: translateX(-50%);
            width: 1000px; height: 1000px;
            background: radial-gradient(circle, rgba(220,38,38,0.12), transparent 60%);
            filter: blur(80px);
            z-index: -2;
            pointer-events: none;
            animation: auraMove 12s ease-in-out infinite;
        }
        @keyframes auraMove {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
            50% { transform: translateX(-50%) scale(1.1); opacity: 1; }
        }

        /* Grain subtil */
        .grain-overlay {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(220,38,38,0.25); border-radius: 100px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(220,38,38,0.5); }

        /* ============================================
        CONTAINER
        ============================================ */
        .login-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        /* ============================================
        LOGIN BOX — GLASS CARD ROUGE
        ============================================ */
        .login-box {
            background: linear-gradient(135deg, rgba(30,10,10,0.55), rgba(10,3,3,0.8));
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--stroke-1);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow:
                0 30px 80px rgba(0,0,0,0.7),
                0 8px 24px rgba(0,0,0,0.4),
                0 0 80px rgba(220,38,38,0.08),
                inset 0 1px 0 rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
            animation: boxIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes boxIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Ligne lumineuse ROUGE en haut */
        .login-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(220,38,38,0.7), transparent);
        }

        /* Halo rouge animé dans le coin */
        .login-box::after {
            content: '';
            position: absolute;
            top: -50%; right: -30%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(220,38,38,0.12) 0%, transparent 60%);
            pointer-events: none;
            animation: auraMove 18s ease-in-out infinite;
        }

        /* ============================================
        HEADER
        ============================================ */
        .login-header {
            text-align: center;
            margin-bottom: 34px;
            position: relative;
            z-index: 1;
        }

        .login-header .logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            position: relative;
        }

        .login-header .logo-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(220,38,38,0.5), transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            animation: logoPulse 4s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        .login-header .logo {
            position: relative;
            z-index: 1;
            width: 72px;
            height: 72px;
            display: block;
            filter:
                drop-shadow(0 0 24px rgba(220,38,38,0.8))
                drop-shadow(0 10px 30px rgba(0,0,0,0.8));
        }

        .login-header h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, #fff 0%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .login-header p {
            color: var(--text-3);
            font-size: 13.5px;
            margin-top: 8px;
            letter-spacing: 0.2px;
        }

        /* ============================================
        FORM
        ============================================ */
        form {
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 18px;
            animation: fieldIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.18s; }
        @keyframes fieldIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-3);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            transition: color 0.25s;
        }

        .form-group:focus-within label {
            color: var(--red-light);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-3);
            pointer-events: none;
            transition: color 0.25s, transform 0.3s;
        }

        .form-group:focus-within .input-icon {
            color: var(--red-light);
            transform: translateY(-50%) scale(1.08);
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--stroke-1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: var(--text-4);
        }

        input:hover {
            background: rgba(220,38,38,0.04);
            border-color: var(--stroke-2);
        }

        input:focus {
            border-color: rgba(220,38,38,0.5);
            background: rgba(220,38,38,0.05);
            box-shadow: 0 0 0 4px rgba(220,38,38,0.08), 0 0 30px rgba(220,38,38,0.15);
            transform: translateY(-1px);
        }

        /* ============================================
        BUTTON
        ============================================ */
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            border: none;
            border-radius: 12px;
            color: #000000;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(255,255,255,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
            letter-spacing: 0.2px;
            margin-top: 6px;
            animation: fieldIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.26s both;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(220,38,38,0.4), transparent);
            transition: left 0.6s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 36px rgba(220,38,38,0.4), inset 0 1px 0 rgba(255,255,255,0.9);
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.99);
        }

        .btn-primary svg {
            width: 20px;
            height: 20px;
            color: #000000;
            transition: transform 0.3s;
        }

        .btn-primary:hover svg {
            transform: translateX(3px);
        }

        /* ============================================
        REGISTER LINK
        ============================================ */
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13.5px;
            color: var(--text-2);
            animation: fieldIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.32s both;
        }

        .register-link a {
            color: var(--red-light);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s;
            position: relative;
        }

        .register-link a::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0;
            width: 0; height: 1px;
            background: var(--red-light);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--red-light);
        }

        .register-link a:hover {
            color: #fff;
            text-shadow: 0 0 12px rgba(220,38,38,0.6);
        }

        .register-link a:hover::after {
            width: 100%;
        }

        /* ============================================
        ERROR MESSAGE
        ============================================ */
        .error-message {
            margin-top: 18px;
            padding: 14px 18px;
            background: rgba(220,38,38,0.08);
            border: 1px solid rgba(220,38,38,0.3);
            border-radius: 12px;
            color: #fca5a5;
            font-size: 13.5px;
            display: none;
            backdrop-filter: blur(10px);
            animation: errorIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 1;
        }

        .error-message::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--red);
            border-radius: 12px 0 0 12px;
            box-shadow: 0 0 20px var(--red);
        }

        @keyframes errorIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
        FOOTER
        ============================================ */
        .login-footer {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid var(--stroke-1);
            padding-top: 18px;
            position: relative;
            z-index: 1;
            animation: fieldIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both;
        }

        .login-footer p {
            font-size: 12px;
            color: var(--text-3);
            line-height: 1.6;
        }

        .login-footer a {
            color: var(--text-2);
            text-decoration: none;
            transition: color 0.25s;
        }

        .login-footer a:hover {
            color: #ffffff;
        }

        .login-footer .cgu-link {
            color: var(--red-light) !important;
            font-weight: 600;
            transition: all 0.25s;
        }

        .login-footer .cgu-link:hover {
            color: #fca5a5 !important;
            text-shadow: 0 0 12px rgba(220,38,38,0.6);
        }

        .login-footer .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-3);
            margin-top: 12px;
        }

        .login-footer .footer-links a {
            color: var(--text-3);
            text-decoration: none;
            transition: color 0.25s;
        }

        .login-footer .footer-links a:hover {
            color: var(--red-light);
        }

        .login-footer .footer-links span {
            color: var(--text-4);
        }

        /* ============================================
        SHAKE ANIMATION
        ============================================ */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================
        MOBILE RESPONSIVE
        ============================================ */
        @media screen and (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 32px;
            }

            .login-box {
                padding: 32px 22px;
                border-radius: 20px;
            }

            .login-header .logo {
                width: 56px;
                height: 56px;
            }

            .login-header .logo-glow {
                width: 100px;
                height: 100px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-header p {
                font-size: 12.5px;
            }

            .login-header {
                margin-bottom: 26px;
            }

            .form-group {
                margin-bottom: 14px;
            }

            .form-group label {
                font-size: 12px;
            }

            input {
                padding: 12px 14px 12px 42px;
                font-size: 16px;
                border-radius: 10px;
            }

            .input-wrapper .input-icon {
                width: 16px;
                height: 16px;
                left: 14px;
            }

            .btn-primary {
                padding: 13px;
                font-size: 14px;
                border-radius: 10px;
            }

            .btn-primary svg {
                width: 18px;
                height: 18px;
            }

            .register-link {
                font-size: 13px;
                margin-top: 16px;
            }

            .error-message {
                font-size: 13px;
                padding: 12px 14px;
            }

            .login-footer p {
                font-size: 11.5px;
            }

            .login-footer .footer-links {
                font-size: 11.5px;
            }
        }

        @media screen and (max-width: 380px) {
            body {
                padding: 8px;
                padding-top: 24px;
            }

            .login-box {
                padding: 24px 18px;
                border-radius: 18px;
            }

            .login-header .logo {
                width: 48px;
                height: 48px;
            }

            .login-header h1 {
                font-size: 20px;
            }

            .login-header p {
                font-size: 12px;
            }

            .form-group {
                margin-bottom: 12px;
            }

            input {
                padding: 10px 12px 10px 38px;
                font-size: 15px;
                border-radius: 9px;
            }

            .input-wrapper .input-icon {
                width: 15px;
                height: 15px;
                left: 12px;
            }

            .btn-primary {
                padding: 11px;
                font-size: 13.5px;
            }

            .register-link {
                font-size: 12.5px;
            }
        }

        @media screen and (min-width: 1024px) {
            .login-box {
                padding: 52px 44px;
            }
        }
    </style>
</head>
<body>

    <div class="grain-overlay"></div>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-wrap">
                    <div class="logo-glow"></div>
                    <img class="logo" src="hydra.png" alt="Marauder">
                </div>
                <h1>Marauder</h1>
                <p>Plateforme d'investigation avancée</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" placeholder="Nom d'utilisateur" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Se connecter
                </button>
                <p class="register-link">Pas de compte ? <a href="#" id="showRegister">S'inscrire</a></p>
            </form>

            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="regUsername" placeholder="Choisissez un nom" required autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="regPassword" placeholder="Minimum 8 caractères" required autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                    Créer un compte
                </button>
                <p class="register-link"><a href="#" id="showLogin">← Retour à la connexion</a></p>
            </form>

            <div id="errorMessage" class="error-message"></div>

            <div class="login-footer">
                <p>
                    En vous connectant ou en vous inscrivant, vous acceptez les
                    <a href="/cgu.html" target="_blank" class="cgu-link">Conditions Générales d'Utilisation</a>
                </p>
                <div class="footer-links">
                    <a href="/cgu.html">CGU</a>
                    <span>·</span>
                    <span>Created by Index</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
