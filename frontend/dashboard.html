<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marauder - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">
    <nav class="sidebar">
        <div class="sidebar-header">
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
            <span>Marauder</span>
        </div>
        <ul class="sidebar-nav">
            <li class="active" data-page="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                Recherche
            </li>
            <li data-page="lookup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                Lookup
            </li>
            <li data-page="history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                Historique
            </li>
            <li data-page="profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Profil
            </li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Déconnexion
            </button>
        </div>
    </nav>

    <main class="main-content">
        <!-- Page Recherche -->
        <section id="page-search" class="page active">
            <header class="page-header">
                <h2>Recherche avancée</h2>
                <div class="user-info">
                    <span id="usernameDisplay"></span>
                </div>
            </header>
            <div class="search-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nom de famille</label>
                        <input type="text" id="searchNom" placeholder="Dupont">
                    </div>
                    <div class="form-group">
                        <label>Prénom</label>
                        <input type="text" id="searchPrenom" placeholder="Jean">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="searchEmail" placeholder="jean.dupont@email.com">
                    </div>
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="tel" id="searchPhone" placeholder="0612345678">
                    </div>
                    <div class="form-group">
                        <label>Ville</label>
                        <input type="text" id="searchVille" placeholder="Paris">
                    </div>
                    <div class="form-group">
                        <label>Code postal</label>
                        <input type="text" id="searchCp" placeholder="75001">
                    </div>
                </div>
                <div class="search-options">
                    <label>
                        <input type="checkbox" id="searchFlexible" checked>
                        Recherche flexible
                    </label>
                    <button id="searchBtn" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        Rechercher
                    </button>
                </div>
            </div>
            <div id="searchResults" class="results-container"></div>
        </section>

        <!-- Page Lookup -->
        <section id="page-lookup" class="page">
            <header class="page-header">
                <h2>Lookup rapide</h2>
            </header>
            <div class="lookup-form">
                <div class="form-group">
                    <label>Type d'identifiant</label>
                    <select id="lookupType">
                        <option value="email">Email</option>
                        <option value="phone">Téléphone</option>
                        <option value="iban">IBAN</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Valeur</label>
                    <input type="text" id="lookupValue" placeholder="jean.dupont@gmail.com">
                </div>
                <button id="lookupBtn" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    Lookup
                </button>
            </div>
            <div id="lookupResults" class="results-container"></div>
        </section>

        <!-- Page Historique -->
        <section id="page-history" class="page">
            <header class="page-header">
                <h2>Historique des recherches</h2>
            </header>
            <div id="historyList" class="results-container"></div>
        </section>

        <!-- Page Profil -->
        <section id="page-profile" class="page">
            <header class="page-header">
                <h2>Profil</h2>
            </header>
            <div id="profileInfo" class="profile-card"></div>
        </section>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
