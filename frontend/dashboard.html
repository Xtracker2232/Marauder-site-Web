    <style>
        /* ============================================
           RESET COMPLET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body.dashboard-page {
            background: #0a0a0a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
        }
        
        /* ============================================
           SIDEBAR
           ============================================ */
        .sidebar {
            width: 220px;
            background: #111111;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            padding: 16px 12px;
        }
        
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px;
        }
        
        .sidebar-header .logo {
            width: 28px;
            height: 28px;
            color: #ffffff;
            opacity: 0.8;
        }
        
        .sidebar-header span {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }
        
        .sidebar-nav {
            list-style: none;
            flex: 1;
        }
        
        .sidebar-nav li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .sidebar-nav li:hover {
            background: rgba(255,255,255,0.03);
            color: #ffffff;
        }
        
        .sidebar-nav li.active {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }
        
        .sidebar-nav li svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        
        .support-toggle {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            padding: 10px 12px !important;
            border-radius: 6px !important;
            cursor: pointer !important;
            color: #a0a0a0 !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            transition: all 0.2s !important;
            margin-top: 4px !important;
        }
        
        .support-toggle:hover {
            background: rgba(255,255,255,0.03) !important;
            color: #ffffff !important;
        }
        
        .support-toggle svg {
            width: 18px !important;
            height: 18px !important;
            flex-shrink: 0 !important;
        }
        
        .support-arrow {
            margin-left: auto !important;
            transition: transform 0.3s ease !important;
        }
        
        .support-submenu {
            padding-left: 36px !important;
            list-style: none !important;
            margin-top: 4px !important;
        }
        
        .support-submenu li {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            padding: 8px 12px !important;
            border-radius: 6px !important;
            cursor: pointer !important;
            color: #a0a0a0 !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            transition: all 0.2s !important;
        }
        
        .support-submenu li:hover {
            background: rgba(255,255,255,0.03) !important;
            color: #ffffff !important;
        }
        
        .support-submenu li svg {
            width: 18px !important;
            height: 18px !important;
            flex-shrink: 0 !important;
        }
        
        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
            margin-top: 12px;
        }
        
        .sidebar-footer button {
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sidebar-footer button:hover {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border-color: rgba(239,68,68,0.2);
        }
        
        .sidebar-footer button svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        
        /* ============================================
           MAIN CONTENT
           ============================================ */
        .main-content {
            margin-left: 220px;
            flex: 1;
            padding: 32px 40px;
            min-height: 100vh;
            background: #0a0a0a;
        }
        
        /* ============================================
           PAGES
           ============================================ */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .page.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        
        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }
        
        .user-info {
            font-size: 14px;
            color: #a0a0a0;
        }
        
        /* ============================================
           RECHERCHE - SECTIONS
           ============================================ */
        .search-tabs {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 4px;
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }
        
        .search-tab {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .search-tab:hover {
            color: #ffffff;
        }
        
        .search-tab.active {
            background: #ffffff;
            color: #000000;
        }
        
        .search-tab-content {
            display: none;
        }
        
        .search-tab-content.active {
            display: block;
        }
        
        .section {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        
        .section-header:hover {
            background: rgba(255,255,255,0.02);
        }
        
        .section-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .section-header .toggle-icon {
            color: #6b6b6b;
            transition: transform 0.3s ease;
        }
        
        .section-header .toggle-icon.open {
            transform: rotate(180deg);
        }
        
        .section-body {
            padding: 0 20px 20px 20px;
            display: none;
        }
        
        .section-body.open {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============================================
           FORMULAIRES
           ============================================ */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        
        .form-group {
            margin-bottom: 0;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0a0;
            margin-bottom: 6px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            border-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
        }
        
        /* ============================================
           BOUTONS
           ============================================ */
        .search-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
        }
        
        .btn-primary {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary:hover {
            background: #cccccc;
        }
        
        .btn-secondary {
            background: transparent;
            color: #a0a0a0;
            border: 1px solid #2a2a2a;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }
        
        #searchBtn,
        #searchBtnPro {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #searchBtn:hover,
        #searchBtnPro:hover {
            background: #cccccc;
        }
        
        #clearBtn,
        #clearBtnPro {
            background: transparent;
            color: #a0a0a0;
            border: 1px solid #2a2a2a;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #clearBtn:hover,
        #clearBtnPro:hover {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }
        
        /* ============================================
           LOOKUP
           ============================================ */
        .lookup-form {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            gap: 16px;
            align-items: end;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .lookup-form .form-group {
            flex: 1;
            min-width: 180px;
            margin-bottom: 0;
        }
        
        .lookup-form .btn-primary {
            width: auto;
            padding: 12px 28px;
        }
        
        /* ============================================
           RESULTATS
           ============================================ */
        .results-container {
            margin-top: 20px;
        }
        
        .results-counter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .results-counter .count {
            font-size: 14px;
            color: #a0a0a0;
        }
        
        .results-counter .count strong {
            color: #ffffff;
            font-weight: 700;
        }
        
        .results-counter .badge {
            font-size: 12px;
            color: #6b6b6b;
            background: rgba(255,255,255,0.03);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
        }
        
        .result-card-full {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        
        .result-card-full:hover {
            border-color: rgba(255,255,255,0.1);
        }
        
        .result-header-full {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .result-name-full {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
        }
        
        .result-name-full:hover {
            opacity: 0.7;
        }
        
        .result-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .result-fields {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px 16px;
            margin-bottom: 16px;
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
        }
        
        .result-fields.open {
            display: grid;
            animation: slideDown 0.3s ease;
        }
        
        .result-field {
            display: flex;
            flex-direction: column;
            padding: 4px 0;
        }
        
        .result-field .field-label {
            font-size: 11px;
            font-weight: 500;
            color: #6b6b6b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .result-field .field-value {
            font-size: 14px;
            color: #a0a0a0;
            word-break: break-all;
        }
        
        .result-field .field-value.highlight {
            color: #ffffff;
        }
        
        .result-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
            flex-wrap: wrap;
        }
        
        .btn-deep {
            padding: 6px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-deep:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
            color: #ffffff;
        }
        
        .btn-deep svg {
            width: 14px;
            height: 14px;
        }
        
        .deep-panel {
            display: none;
            margin-top: 12px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid #2a2a2a;
            border-radius: 8px;
        }
        
        .deep-panel.open {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        .deep-panel h4 {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #6b6b6b;
        }
        
        /* ============================================
           FICHES
           ============================================ */
        .fiche-item {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        
        .fiche-item:hover {
            border-color: rgba(255,255,255,0.1);
        }
        
        .fiche-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .fiche-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .fiche-count {
            font-size: 12px;
            color: #6b6b6b;
            background: rgba(255,255,255,0.03);
            padding: 2px 10px;
            border-radius: 12px;
        }
        
        .fiche-persons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        
        .fiche-person {
            font-size: 13px;
            color: #a0a0a0;
            background: rgba(255,255,255,0.02);
            border: 1px solid #2a2a2a;
            padding: 2px 10px;
            border-radius: 4px;
        }
        
        .fiche-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #2a2a2a;
        }
        
        .fiche-btn {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .fiche-btn:hover {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.2);
            color: #ffffff;
        }
        
        .fiche-btn.danger:hover {
            border-color: rgba(239,68,68,0.3);
            color: #ef4444;
        }
        
        /* ============================================
           HISTORIQUE
           ============================================ */
        .history-item {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        
        .history-item:hover {
            border-color: rgba(255,255,255,0.1);
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .history-date {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0a0a0;
        }
        
        .history-date svg {
            opacity: 0.5;
        }
        
        .history-time {
            color: #6b6b6b;
            font-size: 12px;
        }
        
        .history-result-count {
            font-size: 13px;
            font-weight: 600;
            color: #10b981;
            padding: 2px 12px;
            border-radius: 12px;
            background: rgba(16,185,129,0.1);
        }
        
        .history-result-count.empty {
            color: #6b6b6b;
            background: rgba(255,255,255,0.03);
        }
        
        .history-footer {
            display: flex;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid #2a2a2a;
        }
        
        .history-replay {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .history-replay:hover {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.2);
            color: #ffffff;
        }
        
        /* ============================================
           TICKETS
           ============================================ */
        .ticket-item {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        
        .ticket-item:hover {
            border-color: rgba(255,255,255,0.1);
        }
        
        .ticket-item .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .ticket-item .ticket-subject {
            font-weight: 600;
            color: #ffffff;
        }
        
        .ticket-item .ticket-meta {
            font-size: 12px;
            color: #6b6b6b;
        }
        
        .ticket-detail {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
        }
        
        .ticket-detail.open {
            display: block;
        }
        
        .ticket-message {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            font-size: 13px;
            color: #a0a0a0;
        }
        
        .ticket-message.admin {
            background: rgba(255,255,255,0.05);
            border-left: 2px solid #3b82f6;
        }
        
        .ticket-message .msg-meta {
            font-size: 11px;
            color: #6b6b6b;
            margin-bottom: 4px;
        }
        
        .ticket-reply {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        
        .ticket-reply input {
            flex: 1;
            padding: 8px 14px;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        
        .ticket-reply input:focus {
            border-color: #ffffff;
        }
