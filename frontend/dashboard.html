<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marauder - Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.discordapp.com/attachments/1477415267452719208/1543881553220997240/favicon-32x32.png?ex=6a967b3e&is=6a9529be&hm=73725b0a8477c3d60cad60b87ea9d91bfbb90672f606b199b78e5e797d1cdb7b&">
    <link rel="shortcut icon" type="image/png" href="https://cdn.discordapp.com/attachments/1477415267452719208/1543881553220997240/favicon-32x32.png?ex=6a967b3e&is=6a9529be&hm=73725b0a8477c3d60cad60b87ea9d91bfbb90672f606b199b78e5e797d1cdb7b&">
    <style>
        /* ============================================
           STYLES COMPLETS
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: Arial, sans-serif; color: #ffffff; min-height: 100vh; }
        body::before, body::after { display: none !important; }

        .sidebar { width: 220px; background: #111111; border-right: 1px solid #2a2a2a; position: fixed; top: 0; left: 0; bottom: 0; padding: 16px 12px; overflow-y: auto; z-index: 1000; transition: transform 0.3s ease; }
        .sidebar-header { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid #2a2a2a; margin-bottom: 12px; }
        .sidebar-header .logo { width: 28px; height: 28px; color: #ffffff; }
        .sidebar-header span { font-size: 18px; font-weight: 800; color: #ffffff; }
        .sidebar-nav { list-style: none; }
        .sidebar-nav li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; cursor: pointer; color: #a0a0a0; font-size: 13px; font-weight: 500; transition: all 0.2s; }
        .sidebar-nav li:hover { background: rgba(255,255,255,0.03); color: #ffffff; }
        .sidebar-nav li.active { background: rgba(255,255,255,0.05); color: #ffffff; }
        .sidebar-nav li svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; }
        .sidebar-footer { padding-top: 12px; border-top: 1px solid #2a2a2a; margin-top: 12px; }
        .sidebar-footer button { width: 100%; padding: 10px 12px; background: transparent; border: 1px solid #2a2a2a; border-radius: 6px; color: #a0a0a0; font-size: 13px; font-family: Arial, sans-serif; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
        .sidebar-footer button:hover { background: rgba(239,68,68,0.1); color: #ef4444; border-color: rgba(239,68,68,0.2); }

        .main-content { margin-left: 220px; padding: 32px 40px; min-height: 100vh; }
        .page { display: none; }
        .page.active { display: block; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-header h2 { font-size: 28px; font-weight: 700; color: #ffffff; }
        .user-info { font-size: 14px; color: #a0a0a0; }

        .search-tabs { background: #1e1e1e; border-radius: 10px; padding: 4px; display: flex; gap: 4px; margin-bottom: 20px; }
        .search-tab { flex: 1; padding: 10px 16px; background: transparent; border: none; border-radius: 8px; color: #a0a0a0; font-size: 13px; font-weight: 500; font-family: Arial, sans-serif; cursor: pointer; transition: all 0.2s; }
        .search-tab:hover { color: #ffffff; }
        .search-tab.active { background: #ffffff; color: #000000; }
        .search-tab-content { display: none; }
        .search-tab-content.active { display: block; }
        .section { background: #111111; border: 1px solid #2a2a2a; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; cursor: pointer; user-select: none; }
        .section-header h3 { font-size: 15px; font-weight: 600; color: #ffffff; }
        .section-header .toggle-icon { color: #6b6b6b; transition: transform 0.3s ease; }
        .section-header .toggle-icon.open { transform: rotate(180deg); }
        .section-body { padding: 0 20px 20px 20px; display: none; }
        .section-body.open { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .form-group { margin-bottom: 0; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #a0a0a0; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 8px; color: #ffffff; font-size: 14px; font-family: Arial, sans-serif; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #ffffff; }

        .search-actions { display: flex; gap: 12px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #2a2a2a; }
        .btn-primary { background: #ffffff; color: #000000; border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: Arial, sans-serif; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        .btn-primary:hover { background: #cccccc; }
        .btn-secondary { background: transparent; color: #a0a0a0; border: 1px solid #2a2a2a; padding: 10px 28px; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: Arial, sans-serif; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); color: #ffffff; }
        #searchBtn, #searchBtnPro { background: #ffffff; color: #000000; border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: Arial, sans-serif; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        #searchBtn:hover, #searchBtnPro:hover { background: #cccccc; }
        #clearBtn, #clearBtnPro { background: transparent; color: #a0a0a0; border: 1px solid #2a2a2a; padding: 10px 28px; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: Arial, sans-serif; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        #clearBtn:hover, #clearBtnPro:hover { background: rgba(255,255,255,0.05); color: #ffffff; }

        .lookup-form { background: #111111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 24px; display: flex; gap: 16px; align-items: end; margin-bottom: 24px; flex-wrap: wrap; }
        .lookup-form .form-group { flex: 1; min-width: 180px; margin-bottom: 0; }
        .lookup-form .btn-primary { width: auto; padding: 12px 28px; }

        .results-container { margin-top: 20px; }
        .result-card-full { background: #111111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px 24px; margin-bottom: 12px; }
        .result-header-full { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #2a2a2a; margin-bottom: 12px; }
        .result-name-full { font-size: 20px; font-weight: 700; color: #ffffff; cursor: pointer; }
        .result-fields { display: none; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 16px; }
        .result-fields.open { display: grid; }
        .result-field .field-label { font-size: 11px; font-weight: 500; color: #6b6b6b; text-transform: uppercase; }
        .result-field .field-value { font-size: 14px; color: #a0a0a0; }
        .result-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2a2a; flex-wrap: wrap; }
        .btn-deep { padding: 6px 16px; background: rgba(255,255,255,0.03); border: 1px solid #2a2a2a; border-radius: 6px; color: #a0a0a0; font-size: 12px; font-family: Arial, sans-serif; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-deep:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); color: #ffffff; }

        .fiche-item { background: #111111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; }
        .fiche-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .fiche-name { font-size: 16px; font-weight: 600; color: #ffffff; }
        .fiche-count { font-size: 12px; color: #6b6b6b; }
        .fiche-persons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .fiche-person { font-size: 13px; color: #a0a0a0; background: rgba(255,255,255,0.02); border: 1px solid #2a2a2a; padding: 2px 10px; border-radius: 4px; }
        .fiche-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2a2a2a; }
        .fiche-btn { padding: 4px 12px; background: transparent; border: 1px solid #2a2a2a; border-radius: 6px; color: #a0a0a0; font-size: 12px; font-family: Arial, sans-serif; cursor: pointer; }
        .fiche-btn:hover { background: rgba(255,255,255,0.03); color: #ffffff; }
        .fiche-btn.danger:hover { border-color: rgba(239,68,68,0.3); color: #ef4444; }

        .history-item { background: #111111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; }
        .history-date { font-size: 13px; color: #a0a0a0; }
        .history-result-count { font-size: 13px; font-weight: 600; color: #10b981; padding: 2px 12px; border-radius: 12px; background: rgba(16,185,129,0.1); }
        .history-result-count.empty { color: #6b6b6b; background: rgba(255,255,255,0.03); }
        .history-footer { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a2a2a; }
        .history-replay { padding: 4px 12px; background: transparent; border: 1px solid #2a2a2a; border-radius: 6px; color: #a0a0a0; font-size: 12px; font-family: Arial, sans-serif; cursor: pointer; }
        .history-replay:hover { background: rgba(255,255,255,0.03); color: #ffffff; }

        .ticket-item { background: #111111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; cursor: pointer; }
        .ticket-item:hover { border-color: rgba(255,255,255,0.1); }
        .ticket-item .ticket-header { display: flex; justify-content: space-between; align-items: center; }
        .ticket-item .ticket-subject { font-weight: 600; color: #ffffff; }
        .ticket-item .ticket-meta { font-size: 12px; color: #6b6b6b; }
        .ticket-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2a2a; }
        .ticket-detail.open { display: block; }
        .ticket-message { padding: 10px 14px; margin-bottom: 8px; background: rgba(255,255,255,0.02); border-radius: 8px; font-size: 13px; color: #a0a0a0; }
        .ticket-message.admin { background: rgba(255,255,255,0.05); border-left: 2px solid #3b82f6; }
        .ticket-message .msg-meta { font-size: 11px; color: #6b6b6b; margin-bottom: 4px; }
        .ticket-reply { display: flex; gap: 10px; margin-top: 12px; }
        .ticket-reply input { flex: 1; padding: 8px 14px; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 6px; color: #ffffff; font-size: 13px; font-family: Arial, sans-serif; outline: none; }
        .ticket-reply input:focus { border-color: #ffffff; }
        .ticket-reply button { padding: 8px 20px; background: #ffffff; border: none; border-radius: 6px; color: #000000; font-weight: 600; font-size: 13px; font-family: Arial, sans-serif; cursor: pointer; transition: background 0.2s; }
        .ticket-reply button:hover { background: #cccccc; }

        .profile-card { background: #111111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 32px; max-width: 500px; }
        .profile-card .profile-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2a2a2a; }
        .profile-card .profile-row:last-child { border-bottom: none; }
        .profile-card .label { color: #6b6b6b; }
        .profile-card .value { color: #ffffff; font-weight: 500; }

        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; max-width: 400px; }
        .toast { padding: 14px 20px; border-radius: 12px; border: 1px solid #2a2a2a; background: #111111; color: #ffffff; font-size: 14px; font-family: Arial, sans-serif; animation: slideInRight 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.6); min-width: 200px; }
        .toast.success { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
        .toast.error { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
        .toast.warning { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.05); }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .toast-close { float: right; background: none; border: none; color: #6b6b6b; cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; }
        .toast-close:hover { color: #ffffff; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #111111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 32px; max-width: 500px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.6); max-height: 80vh; overflow-y: auto; }
        .modal h3 { font-size: 20px; font-weight: 600; color: #ffffff; margin-bottom: 16px; }
        .modal .form-group { margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .modal-actions .btn-primary { width: auto; padding: 10px 24px; }
        .modal-actions .btn-secondary { padding: 10px 24px; }

        .mobile-menu-btn { display: none; position: fixed; top: 12px; left: 12px; z-index: 1001; background: #111111; border: 1px solid #2a2a2a; border-radius: 10px; color: #ffffff; padding: 8px 10px; cursor: pointer; width: 44px; height: 44px; align-items: center; justify-content: center; }
        .sidebar-backdrop { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999; }
        .sidebar-backdrop.active { display: block; }

        @media screen and (max-width: 768px) {
            .mobile-menu-btn { display: flex !important; }
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px 12px; padding-top: 16px; }
            .page-header { padding-left: 48px; flex-direction: column; align-items: flex-start; gap: 12px; }
            .form-grid { grid-template-columns: 1fr; }
            .search-actions { flex-direction: column; }
            .search-actions .btn-primary, .search-actions .btn-secondary,
            #searchBtn, #searchBtnPro, #clearBtn, #clearBtnPro { width: 100%; justify-content: center; }
            .lookup-form { flex-direction: column; }
            .lookup-form .form-group { min-width: unset; width: 100%; }
            .lookup-form .btn-primary { width: 100%; justify-content: center; }
            .result-header-full { flex-direction: column; align-items: flex-start; gap: 8px; }
            .result-fields.open { grid-template-columns: 1fr; }
            .search-tabs { flex-wrap: nowrap; overflow-x: auto; }
            .search-tab { flex: 0 0 auto; white-space: nowrap; font-size: 12px; padding: 8px 14px; }
            .fiche-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .history-header { flex-direction: column; align-items: flex-start; gap: 6px; }
            .ticket-item .ticket-header { flex-direction: column; align-items: flex-start; gap: 6px; }
        }
    </style>
</head>
<body>

    <!-- ============ BOUTON MENU MOBILE ============ -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ============ SIDEBAR ============ -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
            <span>Marauder</span>
        </div>
        <ul class="sidebar-nav">
            <li class="active" data-page="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Recherche</span>
            </li>
            <li data-page="lookup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <span>Lookup</span>
            </li>
            <li data-page="history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>Historique</span>
            </li>
            <li data-page="fiches">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Fiches</span>
            </li>
            <li data-page="graphe">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/><line x1="12" x2="12" y1="3" y2="9"/><line x1="12" x2="12" y1="15" y2="21"/></svg>
                <span>Graphe</span>
            </li>
            <li data-page="tickets">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7L12 13L2 7"/></svg>
                <span>Tickets</span>
            </li>
            <li data-page="profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profil</span>
            </li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Deconnexion</span>
            </button>
        </div>
    </nav>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="main-content">

        <!-- ===== PAGE RECHERCHE ===== -->
        <section id="page-search" class="page active">
            <header class="page-header">
                <h2>Recherche</h2>
                <div class="user-info">
                    <span id="usernameDisplay">Admin</span>
                </div>
            </header>

            <div class="search-tabs">
                <button class="search-tab active" data-tab="french">Recherche francaise</button>
                <button class="search-tab" data-tab="pro">Recherche Pro</button>
            </div>

            <div id="tab-french" class="search-tab-content active">
                <div class="section">
                    <div class="section-header" data-section="identity">
                        <h3>Identite</h3>
                        <svg class="toggle-icon open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body open">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Nom</label>
                                <input type="text" id="searchNom" placeholder="Dupont">
                            </div>
                            <div class="form-group">
                                <label>Prenom</label>
                                <input type="text" id="searchPrenom" placeholder="Jean">
                            </div>
                            <div class="form-group">
                                <label>Nom de naissance</label>
                                <input type="text" id="searchNomNaissance" placeholder="Martin">
                            </div>
                            <div class="form-group">
                                <label>Nom affiche</label>
                                <input type="text" id="searchNomAffichage" placeholder="Jean Dupont">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" data-section="contact">
                        <h3>Contact</h3>
                        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="searchEmail" placeholder="jean@example.com">
                            </div>
                            <div class="form-group">
                                <label>Telephone</label>
                                <input type="tel" id="searchPhone" placeholder="0612345678">
                            </div>
                            <div class="form-group">
                                <label>Nom d'utilisateur</label>
                                <input type="text" id="searchUsername" placeholder="jean_d">
                            </div>
                            <div class="form-group">
                                <label>Adresse IP</label>
                                <input type="text" id="searchIp" placeholder="192.168.1.1">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="search-actions">
                    <button id="searchBtn" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        Rechercher
                    </button>
                    <button id="clearBtn" class="btn-secondary">

    <!-- ============ SCRIPTS ============ -->
    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login';
        }

        console.log('Dashboard chargé');

        // ============ TOAST ============
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            if (!container) {
                alert(message);
                return;
            }
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = message + ' <button class="toast-close" onclick="this.parentElement.remove()">×</button>';
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }
            }, duration);
        }

        // ============ MODAL ============
        function showModal(title, bodyHtml, confirmText, onConfirm) {
            const overlay = document.getElementById('modalOverlay');
            const titleEl = document.getElementById('modalTitle');
            const bodyEl = document.getElementById('modalBody');
            if (!overlay || !titleEl || !bodyEl) return;
            titleEl.textContent = title;
            bodyEl.innerHTML = bodyHtml;
            overlay.classList.add('active');
            const confirmBtn = document.getElementById('modalConfirm');
            const cancelBtn = document.getElementById('modalCancel');
            
            if (confirmBtn) {
                const newConfirm = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
                newConfirm.addEventListener('click', function() {
                    if (onConfirm) onConfirm();
                    closeModal();
                });
            }
            if (cancelBtn) {
                const newCancel = cancelBtn.cloneNode(true);
                cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
                newCancel.addEventListener('click', closeModal);
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // ============ SECTIONS TOGGLE ============
        document.querySelectorAll('.section-header').forEach(header => {
            header.addEventListener('click', function() {
                const body = this.nextElementSibling;
                const icon = this.querySelector('.toggle-icon');
                if (body) body.classList.toggle('open');
                if (icon) icon.classList.toggle('open');
            });
        });

        // ============ TABS ============
        document.querySelectorAll('.search-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.search-tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            });
        });

        // ============ VERIFY TOKEN ============
        async function verifyToken() {
            try {
                const response = await fetch(API_URL + '/api/verify', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!response.ok) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                document.getElementById('usernameDisplay').textContent = data.user.username;
            } catch (error) {
                console.error('Erreur verify:', error);
            }
        }
        verifyToken();

        // ============ LOGOUT ============
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Se déconnecter ?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/';
            }
        });

        // ============ NAVIGATION ============
        document.querySelectorAll('.sidebar-nav li').forEach(item => {
            item.addEventListener('click', function() {
                const page = this.dataset.page;
                document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + page).classList.add('active');
                if (page === 'profile') loadProfile();
                if (page === 'history') loadHistory();
                if (page === 'fiches') loadFiches();
                if (page === 'tickets') loadTickets();
            });
        });

        // ============ FORMAT PHONE ============
        function formatPhone(phone) {
            if (!phone) return '';
            const cleaned = phone.replace(/\D/g, '');
            if (cleaned.length === 10) {
                return cleaned.replace(/(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4 $5');
            }
            return phone;
        }

        // ============ DISPLAY RESULTS ============
        function displayResults(container, results) {
            if (!results || results.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun resultat trouve</div>';
                return;
            }

            const cardsHtml = results.map((person, index) => {
                const confidence = person._confidence || 0;
                const fullName = (person.prenom || '') + ' ' + (person.nom_famille || 'Inconnu');
                
                let fieldsHtml = '';
                Object.entries(person)
                    .filter(([key]) => !key.startsWith('_'))
                    .forEach(([key, value]) => {
                        if (!value) return;
                        const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        let displayValue = value;
                        if (key === 'telephone' || key === 'mobile') displayValue = formatPhone(value);
                        fieldsHtml += `
                            <div class="result-field">
                                <span class="field-label">${label}</span>
                                <span class="field-value">${displayValue}</span>
                            </div>
                        `;
                    });
                
                return `
                    <div class="result-card-full">
                        <div class="result-header-full">
                            <div class="result-name-full">${fullName}</div>
                            <div class="result-meta">
                                <span style="font-size:12px;color:${confidence >= 70 ? '#10b981' : confidence >= 40 ? '#f59e0b' : '#ef4444'};">${confidence}%</span>
                            </div>
                        </div>
                        <div class="result-fields open">${fieldsHtml}</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="results-counter">
                    <div class="count"><strong>${results.length}</strong> resultat${results.length > 1 ? 's' : ''}</div>
                    <div class="badge">${results.length > 1 ? 'Plusieurs correspondances' : 'Correspondance unique'}</div>
                </div>
                ${cardsHtml}
            `;
        }

        // ============ SEARCH ============
        document.getElementById('searchBtn').addEventListener('click', async function() {
            const query = {
                flexible: true,
                per_page: 100,
                page: 1,
                nom_famille: document.getElementById('searchNom')?.value || undefined,
                prenom: document.getElementById('searchPrenom')?.value || undefined,
                nom_naissance: document.getElementById('searchNomNaissance')?.value || undefined,
                nom_affichage: document.getElementById('searchNomAffichage')?.value || undefined,
                email: document.getElementById('searchEmail')?.value || undefined,
                telephone: document.getElementById('searchPhone')?.value || undefined,
                nom_utilisateur: document.getElementById('searchUsername')?.value || undefined,
                adresse_ip: document.getElementById('searchIp')?.value || undefined,
                adresse: document.getElementById('searchAdresse')?.value || undefined,
                code_postal: document.getElementById('searchCp')?.value || undefined,
                ville: document.getElementById('searchVille')?.value || undefined,
                ville_naissance: document.getElementById('searchVilleNaissance')?.value || undefined,
                steam_id: document.getElementById('searchSteam')?.value || undefined,
                fivem_license: document.getElementById('searchFivemLicense')?.value || undefined,
                discord_id: document.getElementById('searchDiscord')?.value || undefined,
                nir: document.getElementById('searchNir')?.value || undefined,
                iban: document.getElementById('searchIban')?.value || undefined,
                vin_plaque: document.getElementById('searchVin')?.value || undefined
            };

            Object.keys(query).forEach(key => query[key] === undefined && delete query[key]);

            if (Object.keys(query).length === 0) {
                showToast('Veuillez remplir au moins un critere', 'warning');
                return;
            }

            const container = document.getElementById('searchResults');
            container.innerHTML = '<div class="empty-state">Recherche en cours...</div>';

            try {
                const response = await fetch(API_URL + '/api/brix/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(query)
                });

                const data = await response.json();
                const results = data.data?.results || [];
                displayResults(container, results);

                if (results.length > 0) {
                    showToast(results.length + ' resultat(s) trouvé(s)', 'success');
                } else {
                    showToast('Aucun resultat', 'info');
                }
            } catch (error) {
                console.error('Search error:', error);
                container.innerHTML = '<div class="empty-state" style="color:#ef4444;">Erreur de recherche</div>';
                showToast('Erreur de recherche', 'error');
            }
        });

        // ============ SEARCH PRO ============
        document.getElementById('searchBtnPro').addEventListener('click', async function() {
            const query = {
                flexible: true,
                per_page: 100,
                page: 1,
                nom_famille: document.getElementById('searchNomPro')?.value || undefined,
                prenom: document.getElementById('searchPrenomPro')?.value || undefined,
                nom_naissance: document.getElementById('searchNomNaissancePro')?.value || undefined,
                email: document.getElementById('searchEmailPro')?.value || undefined,
                telephone: document.getElementById('searchPhonePro')?.value || undefined,
                adresse_ip: document.getElementById('searchIpPro')?.value || undefined,
                societe: document.getElementById('searchSociete')?.value || undefined,
                profession: document.getElementById('searchProfession')?.value || undefined,
                fonction: document.getElementById('searchFonction')?.value || undefined,
                siret: document.getElementById('searchSiret')?.value || undefined,
                siren: document.getElementById('searchSiren')?.value || undefined,
                nir: document.getElementById('searchNirPro')?.value || undefined,
                iban: document.getElementById('searchIbanPro')?.value || undefined,
                vin_plaque: document.getElementById('searchVinPro')?.value || undefined
            };

            Object.keys(query).forEach(key => query[key] === undefined && delete query[key]);

            if (Object.keys(query).length === 0) {
                showToast('Veuillez remplir au moins un critere', 'warning');
                return;
            }

            const container = document.getElementById('searchResults');
            container.innerHTML = '<div class="empty-state">Recherche en cours...</div>';

            try {
                const response = await fetch(API_URL + '/api/brix/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(query)
                });

                const data = await response.json();
                const results = data.data?.results || [];
                displayResults(container, results);

                if (results.length > 0) {
                    showToast(results.length + ' resultat(s) trouvé(s)', 'success');
                } else {
                    showToast('Aucun resultat', 'info');
                }
            } catch (error) {
                console.error('Search error:', error);
                container.innerHTML = '<div class="empty-state" style="color:#ef4444;">Erreur de recherche</div>';
                showToast('Erreur de recherche', 'error');
            }
        });

        // ============ CLEAR ============
        document.getElementById('clearBtn').addEventListener('click', function() {
            document.querySelectorAll('#tab-french input, #tab-french select').forEach(el => el.value = '');
            document.getElementById('searchResults').innerHTML = '';
            showToast('Formulaire efface');
        });

        document.getElementById('clearBtnPro').addEventListener('click', function() {
            document.querySelectorAll('#tab-pro input, #tab-pro select').forEach(el => el.value = '');
            document.getElementById('searchResults').innerHTML = '';
            showToast('Formulaire Pro efface');
        });

        // ============ LOOKUP ============
        document.getElementById('lookupBtn').addEventListener('click', async function() {
            const type = document.getElementById('lookupType').value;
            const value = document.getElementById('lookupValue').value.trim();

            if (!value) {
                showToast('Veuillez entrer une valeur', 'warning');
                return;
            }

            const container = document.getElementById('lookupResults');
            container.innerHTML = '<div class="empty-state">Recherche en cours...</div>';

            try {
                const response = await fetch(API_URL + '/api/brix/lookup/' + type + '/' + encodeURIComponent(value), {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                const data = await response.json();
                const results = data.data?.results || [];

                if (results.length > 0) {
                    displayResults(container, results);
                    showToast(results.length + ' enregistrement(s) trouvé(s)', 'success');
                } else {
                    container.innerHTML = '<div class="empty-state">Aucun resultat trouve</div>';
                    showToast('Aucun resultat', 'info');
                }
            } catch (error) {
                console.error('Lookup error:', error);
                container.innerHTML = '<div class="empty-state" style="color:#ef4444;">Erreur de lookup</div>';
                showToast('Erreur de lookup', 'error');
            }
        });

        // ============ HISTORY ============
        async function loadHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '<div class="empty-state">Chargement...</div>';

            try {
                const response = await fetch(API_URL + '/api/history', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                const history = data.history || [];

                if (history.length === 0) {
                    container.innerHTML = '<div class="empty-state">Aucune recherche dans l\'historique</div>';
                    return;
                }

                container.innerHTML = history.map(item => {
                    const date = new Date(item.created_at);
                    const resultCount = item.results_count || 0;
                    return `
                        <div class="history-item">
                            <div class="history-header">
                                <div class="history-date">${date.toLocaleString()}</div>
                                <span class="history-result-count ${resultCount === 0 ? 'empty' : ''}">${resultCount} resultat${resultCount > 1 ? 's' : ''}</span>
                            </div>
                            <div class="history-footer">
                                <button class="history-replay" onclick="replaySearch(${item.id})">Relancer</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('History error:', error);
                container.innerHTML = '<div class="empty-state" style="color:#ef4444;">Erreur de chargement</div>';
            }
        }

        async function replaySearch(id) {
            try {
                showToast('Relance de la recherche...', 'info');
                const response = await fetch(API_URL + '/api/history/' + id + '/replay', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                const results = data.results || [];
                
                document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active'));
                document.querySelector('[data-page="search"]').classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-search').classList.add('active');
                
                const container = document.getElementById('searchResults');
                displayResults(container, results);
                showToast(results.length + ' resultat(s) trouvé(s)', 'success');
            } catch (error) {
                console.error('Replay error:', error);
                showToast('Erreur de relance', 'error');
            }
        }

        // ============ FICHES ============
        let fichesData = [];

        async function loadFiches() {
            const container = document.getElementById('fichesList');
            container.innerHTML = '<div class="empty-state">Chargement...</div>';

            try {
                const response = await fetch(API_URL + '/api/fiches', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                fichesData = data.fiches || [];

                if (fichesData.length === 0) {
                    container.innerHTML = '<div class="empty-state">Aucune fiche creee</div>';
                    return;
                }

                container.innerHTML = fichesData.map((fiche, index) => `
                    <div class="fiche-item">
                        <div class="fiche-header">
                            <span class="fiche-name">${fiche.name}</span>
                            <span class="fiche-count">${fiche.persons?.length || 0} personne${fiche.persons?.length > 1 ? 's' : ''}</span>
                        </div>
                        <div class="fiche-persons">
                            ${fiche.persons?.map(p => `<span class="fiche-person">${p.prenom || ''} ${p.nom_famille || 'Inconnu'}</span>`).join('') || 'Aucune personne'}
                        </div>
                        <div class="fiche-actions">
                            <button class="fiche-btn" onclick="viewFiche(${index})">Voir</button>
                            <button class="fiche-btn" onclick="editFiche(${index})">Modifier</button>
                            <button class="fiche-btn danger" onclick="deleteFiche(${index})">Supprimer</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Fiches error:', error);
                container.innerHTML = '<div class="empty-state" style="color:#ef4444;">Erreur de chargement</div>';
            }
        }

        document.getElementById('createFicheBtn').addEventListener('click', function() {
            showModal('Creer une fiche', `
                <div class="form-group">
                    <label>Nom de la fiche</label>
                    <input type="text" id="ficheNameInput" placeholder="Ex: Enquete Dupont" style="width:100%;padding:10px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;color:#fff;">
                </div>
                <div style="font-size:12px;color:#6b6b6b;">Maximum 10 personnes par fiche</div>
            `, 'Creer', async function() {
                const name = document.getElementById('ficheNameInput').value.trim();
                if (!name) {
                    showToast('Veuillez donner un nom', 'warning');
                    return;
                }
                try {
                    const response = await fetch(API_URL + '/api/fiches', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({ name })
                    });
                    if (response.ok) {
                        showToast('Fiche creee !', 'success');
                        loadFiches();
                        closeModal();
                    }
                } catch (error) {
                    showToast('Erreur', 'error');
                }
            });
        });

        function viewFiche(index) {
            const fiche = fichesData[index];
            if (!fiche) return;
            const personsHtml = fiche.persons?.map(p => `
                <div style="padding:4px 0;border-bottom:1px solid #2a2a2a;font-size:13px;color:#a0a0a0;">
                    ${p.prenom || ''} ${p.nom_famille || 'Inconnu'}
                </div>
            `).join('') || 'Aucune personne';
            showModal('Fiche: ' + fiche.name, `
                <div style="margin-bottom:12px;font-size:13px;color:#6b6b6b;">${fiche.persons?.length || 0} / 10 personnes</div>
                <div style="max-height:300px;overflow-y:auto;">${personsHtml}</div>
            `, 'Fermer', closeModal);
        }

        function editFiche(index) {
            const fiche = fichesData[index];
            if (!fiche) return;
            showModal('Modifier la fiche', `
                <div class="form-group">
                    <label>Nom de la fiche</label>
                    <input type="text" id="editFicheName" value="${fiche.name}" style="width:100%;padding:10px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;color:#fff;">
                </div>
            `, 'Sauvegarder', async function() {
                const name = document.getElementById('editFicheName').value.trim();
                if (!name) {
                    showToast('Veuillez donner un nom', 'warning');
                    return;
                }
                try {
                    const response = await fetch(API_URL + '/api/fiches/' + fiche.id, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({ name })
                    });
                    if (response.ok) {
                        showToast('Fiche modifiee !', 'success');
                        loadFiches();
                        closeModal();
                    }
                } catch (error) {
                    showToast('Erreur', 'error');
                }
            });
        }

        function deleteFiche(index) {
            const fiche = fichesData[index];
            if (!fiche) return;
            showModal('Confirmation', `
                <p style="color:#a0a0a0;">Supprimer la fiche "<strong style="color:#ffffff;">${fiche.name}</strong>" ?</p>
                <p style="font-size:13px;color:#6b6b6b;">Cette action est irreversible.</p>
            `, 'Supprimer', async function() {
                try {
                    const response = await fetch(API_URL + '/api/fiches/' + fiche.id, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (response.ok) {
                        showToast('Fiche supprimee !', 'success');
                        loadFiches();
                        closeModal();
                    }
                } catch (error) {
                    showToast('Erreur', 'error');
                }
            });
        }

        // ============ TICKETS ============
        async function loadTickets() {
            const container = document.getElementById('ticketsList');
            container.innerHTML = '<div class="empty-state">Chargement...</div>';

            try {
                const response = await fetch(API_URL + '/api/tickets', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                const tickets = data.tickets || [];

                if (tickets.length === 0) {
                    container.innerHTML = '<div class="empty-state">Aucun ticket</div>';
                    return;
                }

                container.innerHTML = tickets.map(ticket => `
                    <div class="ticket-item" onclick="viewTicket(${ticket.id})">
                        <div class="ticket-header">
                            <span class="ticket-subject">${ticket.subject}</span>
                            <span class="ticket-meta">${new Date(ticket.created_at).toLocaleString()} · ${ticket.status}</span>
                        </div>
                        <div style="font-size:13px;color:#a0a0a0;margin-top:4px;">${ticket.message?.substring(0, 100) || ''}${ticket.message?.length > 100 ? '...' : ''}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Tickets error:', error);
                container.innerHTML = '<div class="empty-state" style="color:#ef4444;">Erreur de chargement</div>';
            }
        }

        document.getElementById('openTicketBtn').addEventListener('click', function() {
            showModal('Nouveau ticket', `
                <div class="form-group">
                    <label>Sujet</label>
                    <input type="text" id="ticketSubject" placeholder="Resume de votre probleme" style="width:100%;padding:10px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;color:#fff;">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="ticketMessage" rows="5" placeholder="Decrivez votre probleme..." style="width:100%;padding:10px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;color:#fff;font-family:Arial;font-size:14px;resize:vertical;"></textarea>
                </div>
            `, 'Envoyer', async function() {
                const subject = document.getElementById('ticketSubject').value.trim();
                const message = document.getElementById('ticketMessage').value.trim();
                if (!subject || !message) {
                    showToast('Veuillez remplir tous les champs', 'warning');
                    return;
                }
                try {
                    const response = await fetch(API_URL + '/api/tickets', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({ subject, message })
                    });
                    if (response.ok) {
                        showToast('Ticket cree !', 'success');
                        loadTickets();
                        closeModal();
                    }
                } catch (error) {
                    showToast('Erreur', 'error');
                }
            });
        });

        async function viewTicket(ticketId) {
            try {
                const response = await fetch(API_URL + '/api/tickets/' + ticketId, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                const ticket = data.ticket;
                const messages = data.messages || [];

                let messagesHtml = messages.map(m => `
                    <div style="padding:10px 14px;margin-bottom:8px;background:${m.is_admin ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)'};border-radius:8px;border-left:${m.is_admin ? '2px solid #3b82f6' : '2px solid #2a2a2a'};">
                        <div style="font-size:11px;color:#6b6b6b;margin-bottom:4px;">
                            ${m.username || 'Inconnu'}${m.is_admin ? ' · Admin' : ''} · ${new Date(m.created_at).toLocaleString()}
                        </div>
                        <div style="font-size:13px;color:#a0a0a0;">${m.message}</div>
                    </div>
                `).join('');

                if (messages.length === 0) {
                    messagesHtml = '<div style="color:#6b6b6b;font-size:13px;">Aucun message</div>';
                }

                showModal(ticket.subject, `
                    <div style="margin-bottom:12px;font-size:13px;color:#6b6b6b;">
                        Statut: ${ticket.status} · Cree le ${new Date(ticket.created_at).toLocaleString()}
                    </div>
                    <div style="max-height:300px;overflow-y:auto;margin-bottom:12px;">
                        ${messagesHtml}
                    </div>
                    ${ticket.status !== 'closed' ? `
                        <div style="display:flex;gap:10px;border-top:1px solid #2a2a2a;padding-top:12px;">
                            <input type="text" id="ticketReplyInput" placeholder="Votre reponse..." style="flex:1;padding:10px 14px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;color:#fff;font-size:14px;font-family:Arial;outline:none;">
                            <button onclick="replyTicket(${ticketId})" class="btn-primary" style="width:auto;padding:10px 24px;">Repondre</button>
                        </div>
                    ` : '<div style="color:#6b6b6b;font-size:13px;border-top:1px solid #2a2a2a;padding-top:12px;">Ce ticket est ferme</div>'}
                `, 'Fermer', closeModal);

            } catch (error) {
                console.error('View ticket error:', error);
                showToast('Erreur de chargement', 'error');
            }
        }

        async function replyTicket(ticketId) {
            const input = document.getElementById('ticketReplyInput');
            if (!input) return;
            const message = input.value.trim();
            if (!message) {
                showToast('Veuillez entrer un message', 'warning');
                return;
            }

            try {
                const response = await fetch(API_URL + '/api/tickets/' + ticketId + '/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ message })
                });
                if (response.ok) {
                    showToast('Message envoye !', 'success');
                    viewTicket(ticketId);
                    loadTickets();
                }
            } catch (error) {
                showToast('Erreur', 'error');
            }
        }

        // ============ PROFIL ============
        async function loadProfile() {
            const container = document.getElementById('profileInfo');
            container.innerHTML = '<div class="empty-state">Chargement...</div>';

            try {
                const response = await fetch(API_URL + '/api/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                if (data.user) {
                    container.innerHTML = `
                        <div class="profile-card">
                            <div class="profile-row"><span class="label">Nom d'utilisateur</span><span class="value">${data.user.username}</span></div>
                            <div class="profile-row"><span class="label">Role</span><span class="value">${data.user.role}</span></div>
                            <div class="profile-row"><span class="label">Membre depuis</span><span class="value">${new Date(data.user.created_at).toLocaleDateString()}</span></div>
                            <div class="profile-row"><span class="label">Derniere connexion</span><span class="value">${data.user.last_login ? new Date(data.user.last_login).toLocaleString() : 'Jamais'}</span></div>
                            <div class="profile-row"><span class="label">Total recherches</span><span class="value">${data.stats?.total_searches || 0}</span></div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Profile error:', error);
                container.innerHTML = '<div class="empty-state" style="color:#ef4444;">Erreur de chargement</div>';
            }
        }

        // ============ GRAPHE BOUTONS ============
        document.getElementById('grapheAddPersonne').addEventListener('click', function() {
            showToast('Ajout d\'une personne au graphe', 'info');
        });

        document.getElementById('grapheAttacher').addEventListener('click', function() {
            showToast('Attacher des personnes', 'info');
        });

        document.getElementById('grapheSauvegarder').addEventListener('click', function() {
            showToast('Sauvegarde du graphe', 'info');
        });

        document.getElementById('grapheMesGraphes').addEventListener('click', function() {
            showToast('Chargement des graphes', 'info');
        });

        document.getElementById('grapheEffacer').addEventListener('click', function() {
            showToast('Graphe efface', 'info');
        });

        // ============ MOBILE MENU ============
        document.getElementById('mobileMenuBtn').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarBackdrop').classList.toggle('active');
        });

        document.getElementById('sidebarBackdrop').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('open');
            this.classList.remove('active');
        });

        // ============ INIT ============
        loadProfile();
        console.log('✅ Dashboard charge avec succes');
    </script>

</body>
</html>
