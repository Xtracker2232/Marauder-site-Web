<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marauder - Dashboard</title>
    <style>
        /* TOUT EN GRIS CLAIR POUR VOIR */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #cccccc !important;
            font-family: Arial, sans-serif;
            color: #000000 !important;
            min-height: 100vh;
            padding: 20px;
        }
        
        .main-content {
            background: #ffffff !important;
            padding: 20px;
            border-radius: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #000000;
        }
        
        .page-header h2 {
            color: #000000 !important;
            font-size: 24px;
        }
        
        .user-info {
            color: #000000 !important;
        }
        
        .section {
            background: #eeeeee !important;
            border: 2px solid #000000 !important;
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 16px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .section-header h3 {
            color: #000000 !important;
            font-size: 16px;
        }
        
        .section-body {
            display: none;
            padding-top: 12px;
        }
        
        .section-body.open {
            display: block;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        
        .form-group label {
            display: block;
            color: #000000 !important;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            background: #ffffff !important;
            border: 2px solid #000000 !important;
            border-radius: 6px;
            color: #000000 !important;
            font-size: 14px;
        }
        
        .search-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .search-tab {
            padding: 8px 16px;
            background: #dddddd;
            border: 2px solid #000000;
            border-radius: 6px;
            cursor: pointer;
            color: #000000;
            font-weight: 600;
        }
        
        .search-tab.active {
            background: #000000;
            color: #ffffff;
        }
        
        .search-tab-content {
            display: none;
        }
        
        .search-tab-content.active {
            display: block;
        }
        
        .search-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px solid #000000;
        }
        
        .btn-primary {
            background: #000000 !important;
            color: #ffffff !important;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-secondary {
            background: transparent !important;
            color: #000000 !important;
            border: 2px solid #000000 !important;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        #searchBtn,
        #searchBtnPro {
            background: #000000 !important;
            color: #ffffff !important;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        #clearBtn,
        #clearBtnPro {
            background: transparent !important;
            color: #000000 !important;
            border: 2px solid #000000 !important;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .result-card-full {
            background: #ffffff !important;
            border: 2px solid #000000 !important;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .result-name-full {
            color: #000000 !important;
            font-size: 18px;
            font-weight: 700;
        }
        
        .result-fields {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        
        .result-fields.open {
            display: grid;
        }
        
        .result-field .field-label {
            color: #666666;
            font-size: 11px;
            text-transform: uppercase;
        }
        
        .result-field .field-value {
            color: #000000 !important;
            font-size: 14px;
        }
        
        .result-field .field-value.highlight {
            color: #000000 !important;
            font-weight: 700;
        }
        
        .result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #000000;
        }
        
        .btn-deep {
            padding: 4px 12px;
            background: #eeeeee;
            border: 2px solid #000000;
            border-radius: 4px;
            color: #000000;
            font-size: 12px;
            cursor: pointer;
        }
        
        .fiche-item {
            background: #ffffff !important;
            border: 2px solid #000000 !important;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .fiche-name {
            color: #000000 !important;
            font-size: 16px;
            font-weight: 700;
        }
        
        .fiche-count {
            color: #666666;
            font-size: 12px;
        }
        
        .fiche-persons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        
        .fiche-person {
            color: #000000 !important;
            background: #eeeeee;
            border: 1px solid #000000;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .fiche-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #000000;
        }
        
        .fiche-btn {
            padding: 4px 12px;
            background: transparent;
            border: 2px solid #000000;
            border-radius: 4px;
            color: #000000;
            font-size: 12px;
            cursor: pointer;
        }
        
        .fiche-btn:hover {
            background: #000000;
            color: #ffffff;
        }
        
        .fiche-btn.danger:hover {
            background: #ff0000;
            color: #ffffff;
            border-color: #ff0000;
        }
        
        .history-item {
            background: #ffffff !important;
            border: 2px solid #000000 !important;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-date {
            color: #000000 !important;
            font-size: 13px;
        }
        
        .history-result-count {
            color: #000000 !important;
            font-weight: 700;
        }
        
        .history-footer {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 2px solid #000000;
        }
        
        .history-replay {
            padding: 4px 12px;
            background: transparent;
            border: 2px solid #000000;
            border-radius: 4px;
            color: #000000;
            font-size: 12px;
            cursor: pointer;
        }
        
        .lookup-form {
            background: #ffffff !important;
            border: 2px solid #000000 !important;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            gap: 16px;
            align-items: end;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .lookup-form .form-group {
            flex: 1;
            min-width: 180px;
        }
        
        .lookup-form .btn-primary {
            background: #000000 !important;
            color: #ffffff !important;
        }
        
        .profile-card {
            background: #ffffff !important;
            border: 2px solid #000000 !important;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
        }
        
        .profile-card .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #000000;
        }
        
        .profile-card .profile-row:last-child {
            border-bottom: none;
        }
        
        .profile-card .label {
            color: #666666;
        }
        
        .profile-card .value {
            color: #000000 !important;
            font-weight: 700;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #000000 !important;
            font-size: 16px;
        }
        
        /* Mobile */
        @media screen and (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .search-actions {
                flex-direction: column;
            }
            
            .search-actions .btn-primary,
            .search-actions .btn-secondary,
            #searchBtn,
            #searchBtnPro,
            #clearBtn,
            #clearBtnPro {
                width: 100%;
                justify-content: center;
            }
            
            .lookup-form {
                flex-direction: column;
            }
            
            .result-fields.open {
                grid-template-columns: 1fr;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .result-header-full {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <!-- PAGE RECHERCHE -->
        <div class="page active">
            <header class="page-header">
                <h2>Recherche</h2>
                <div class="user-info">Utilisateur: Admin</div>
            </header>

            <div class="search-tabs">
                <button class="search-tab active" data-tab="french">Recherche francaise</button>
                <button class="search-tab" data-tab="pro">Recherche Pro</button>
            </div>

            <div id="tab-french" class="search-tab-content active">
                <div class="section">
                    <div class="section-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        <h3>Identite</h3>
                        <span>▼</span>
                    </div>
                    <div class="section-body open">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Nom</label>
                                <input type="text" placeholder="Dupont">
                            </div>
                            <div class="form-group">
                                <label>Prenom</label>
                                <input type="text" placeholder="Jean">
                            </div>
                            <div class="form-group">
                                <label>Nom de naissance</label>
                                <input type="text" placeholder="Martin">
                            </div>
                            <div class="form-group">
                                <label>Nom affiche</label>
                                <input type="text" placeholder="Jean Dupont">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        <h3>Contact</h3>
                        <span>▼</span>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" placeholder="jean@example.com">
                            </div>
                            <div class="form-group">
                                <label>Telephone</label>
                                <input type="tel" placeholder="0612345678">
                            </div>
                            <div class="form-group">
                                <label>Nom d'utilisateur</label>
                                <input type="text" placeholder="jean_d">
                            </div>
                            <div class="form-group">
                                <label>Adresse IP</label>
                                <input type="text" placeholder="192.168.1.1">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        <h3>Localisation</h3>
                        <span>▼</span>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Adresse</label>
                                <input type="text" placeholder="10 rue de la Paix">
                            </div>
                            <div class="form-group">
                                <label>Code postal</label>
                                <input type="text" placeholder="75001">
                            </div>
                            <div class="form-group">
                                <label>Ville</label>
                                <input type="text" placeholder="Paris">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="search-actions">
                    <button id="searchBtn" class="btn-primary">Rechercher</button>
                    <button id="clearBtn" class="btn-secondary">Effacer</button>
                </div>
            </div>

            <div id="tab-pro" class="search-tab-content">
                <div class="section">
                    <div class="section-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        <h3>Identite Pro</h3>
                        <span>▼</span>
                    </div>
                    <div class="section-body open">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Nom</label>
                                <input type="text" placeholder="Dupont">
                            </div>
                            <div class="form-group">
                                <label>Prenom</label>
                                <input type="text" placeholder="Jean">
                            </div>
                            <div class="form-group">
                                <label>Societe</label>
                                <input type="text" placeholder="Entreprise SAS">
                            </div>
                            <div class="form-group">
                                <label>Profession</label>
                                <input type="text" placeholder="Developpeur">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="search-actions">
                    <button id="searchBtnPro" class="btn-primary">Rechercher</button>
                    <button id="clearBtnPro" class="btn-secondary">Effacer</button>
                </div>
            </div>

            <div id="searchResults" class="results-container"></div>
        </div>

        <!-- FOOTER -->
        <div style="border-top:2px solid #000000;padding:16px;margin-top:40px;text-align:center;color:#000000;">
            <a href="/cgu.html" style="color:#000000;text-decoration:none;">CGU</a>
            <span> · </span>
            <span>Created by Index</span>
        </div>
    </div>

    <script>
        // Tabs
        document.querySelectorAll('.search-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.search-tab-content').forEach(c => c.classList.remove('active'));
                const tabId = this.dataset.tab;
                const target = document.getElementById(`tab-${tabId}`);
                if (target) target.classList.add('active');
            });
        });
    </script>

</body>
</html>
