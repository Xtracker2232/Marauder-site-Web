<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marauder - Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.discordapp.com/attachments/1477415267452719208/1543881553220997240/favicon-32x32.png?ex=6a967b3e&is=6a9529be&hm=73725b0a8477c3d60cad60b87ea9d91bfbb90672f606b199b78e5e797d1cdb7b&">
    <link rel="shortcut icon" type="image/png" href="https://cdn.discordapp.com/attachments/1477415267452719208/1543881553220997240/favicon-32x32.png?ex=6a967b3e&is=6a9529be&hm=73725b0a8477c3d60cad60b87ea9d91bfbb90672f606b199b78e5e797d1cdb7b&">
    <style>
        /* ============================================
           STYLES COMPLETS
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }
        body::before,
        body::after {
            display: none !important;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #111111;
            border-right: 1px solid #2a2a2a;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            padding: 16px 12px;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px;
        }
        .sidebar-header .logo {
            width: 28px;
            height: 28px;
            color: #ffffff;
        }
        .sidebar-header span {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }
        .sidebar-nav {
            list-style: none;
        }
        .sidebar-nav li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sidebar-nav li:hover {
            background: rgba(255,255,255,0.03);
            color: #ffffff;
        }
        .sidebar-nav li.active {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }
        .sidebar-nav li svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
            margin-top: 12px;
        }
        .sidebar-footer button {
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 13px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }
        .sidebar-footer button:hover {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border-color: rgba(239,68,68,0.2);
        }
        .sidebar-footer button svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 220px;
            padding: 32px 40px;
            min-height: 100vh;
        }

        /* PAGES */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }
        .user-info {
            font-size: 14px;
            color: #a0a0a0;
        }

        /* RECHERCHE */
        .search-tabs {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 4px;
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }
        .search-tab {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-tab:hover {
            color: #ffffff;
        }
        .search-tab.active {
            background: #ffffff;
            color: #000000;
        }
        .search-tab-content {
            display: none;
        }
        .search-tab-content.active {
            display: block;
        }
        .section {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
        }
        .section-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }
        .section-header .toggle-icon {
            color: #6b6b6b;
            transition: transform 0.3s ease;
        }
        .section-header .toggle-icon.open {
            transform: rotate(180deg);
        }
        .section-body {
            padding: 0 20px 20px 20px;
            display: none;
        }
        .section-body.open {
            display: block;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .form-group {
            margin-bottom: 0;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0a0;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-family: Arial, sans-serif;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #ffffff;
        }

        /* BOUTONS */
        .search-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
        }
        .btn-primary {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-primary:hover {
            background: #cccccc;
        }
        .btn-secondary {
            background: transparent;
            color: #a0a0a0;
            border: 1px solid #2a2a2a;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }

        #searchBtn,
        #searchBtnPro {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #searchBtn:hover,
        #searchBtnPro:hover {
            background: #cccccc;
        }

        #clearBtn,
        #clearBtnPro {
            background: transparent;
            color: #a0a0a0;
            border: 1px solid #2a2a2a;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #clearBtn:hover,
        #clearBtnPro:hover {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }

        /* LOOKUP */
        .lookup-form {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            gap: 16px;
            align-items: end;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .lookup-form .form-group {
            flex: 1;
            min-width: 180px;
            margin-bottom: 0;
        }
        .lookup-form .btn-primary {
            width: auto;
            padding: 12px 28px;
        }

        /* RESULTATS */
        .results-container {
            margin-top: 20px;
        }
        .result-card-full {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 12px;
        }
        .result-header-full {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px;
        }
        .result-name-full {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
        }
        .result-fields {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px 16px;
        }
        .result-fields.open {
            display: grid;
        }
        .result-field .field-label {
            font-size: 11px;
            font-weight: 500;
            color: #6b6b6b;
            text-transform: uppercase;
        }
        .result-field .field-value {
            font-size: 14px;
            color: #a0a0a0;
        }

        /* FICHES */
        .fiche-item {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        .fiche-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .fiche-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
        .fiche-count {
            font-size: 12px;
            color: #6b6b6b;
        }
        .fiche-persons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .fiche-person {
            font-size: 13px;
            color: #a0a0a0;
            background: rgba(255,255,255,0.02);
            border: 1px solid #2a2a2a;
            padding: 2px 10px;
            border-radius: 4px;
        }
        .fiche-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #2a2a2a;
        }
        .fiche-btn {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 12px;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }
        .fiche-btn:hover {
            background: rgba(255,255,255,0.03);
            color: #ffffff;
        }

        /* HISTORIQUE */
        .history-item {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-date {
            font-size: 13px;
            color: #a0a0a0;
        }
        .history-result-count {
            font-size: 13px;
            font-weight: 600;
            color: #10b981;
            padding: 2px 12px;
            border-radius: 12px;
            background: rgba(16,185,129,0.1);
        }
        .history-result-count.empty {
            color: #6b6b6b;
            background: rgba(255,255,255,0.03);
        }
        .history-footer {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #2a2a2a;
        }
        .history-replay {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 12px;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }
        .history-replay:hover {
            background: rgba(255,255,255,0.03);
            color: #ffffff;
        }

        /* TICKETS */
        .ticket-item {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .ticket-item:hover {
            border-color: rgba(255,255,255,0.1);
        }
        .ticket-item .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ticket-item .ticket-subject {
            font-weight: 600;
            color: #ffffff;
        }
        .ticket-item .ticket-meta {
            font-size: 12px;
            color: #6b6b6b;
        }

        /* PROFIL */
        .profile-card {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
        }
        .profile-card .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .profile-card .profile-row:last-child {
            border-bottom: none;
        }
        .profile-card .label {
            color: #6b6b6b;
        }
        .profile-card .value {
            color: #ffffff;
            font-weight: 500;
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            background: #111111;
            color: #ffffff;
            font-size: 14px;
            font-family: Arial, sans-serif;
            animation: slideInRight 0.3s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            min-width: 200px;
        }
        .toast.success { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
        .toast.error { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
        .toast.warning { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.05); }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .toast-close {
            float: right;
            background: none;
            border: none;
            color: #6b6b6b;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0 4px;
        }
        .toast-close:hover { color: #ffffff; }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-actions .btn-primary { width: auto; padding: 10px 24px; }
        .modal-actions .btn-secondary { padding: 10px 24px; }

        /* MOBILE */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #ffffff;
            padding: 8px 10px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
        }
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 999;
        }
        .sidebar-backdrop.active { display: block; }

        @media screen and (max-width: 768px) {
            .mobile-menu-btn { display: flex !important; }
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px 12px; padding-top: 16px; }
            .page-header { padding-left: 48px; flex-direction: column; align-items: flex-start; gap: 12px; }
            .form-grid { grid-template-columns: 1fr; }
            .search-actions { flex-direction: column; }
            .search-actions .btn-primary, .search-actions .btn-secondary,
            #searchBtn, #searchBtnPro, #clearBtn, #clearBtnPro {
                width: 100%;
                justify-content: center;
            }
            .lookup-form { flex-direction: column; }
            .lookup-form .form-group { min-width: unset; width: 100%; }
            .lookup-form .btn-primary { width: 100%; justify-content: center; }
            .result-header-full { flex-direction: column; align-items: flex-start; gap: 8px; }
            .result-fields.open { grid-template-columns: 1fr; }
            .search-tabs { flex-wrap: nowrap; overflow-x: auto; }
            .search-tab { flex: 0 0 auto; white-space: nowrap; font-size: 12px; padding: 8px 14px; }
        }
    </style>
</head>
<body>

    <!-- ============ BOUTON MENU MOBILE ============ -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ============ SIDEBAR ============ -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
            <span>Marauder</span>
        </div>
        <ul class="sidebar-nav">
            <li class="active" data-page="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Recherche</span>
            </li>
            <li data-page="lookup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <span>Lookup</span>
            </li>
            <li data-page="history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>Historique</span>
            </li>
            <li data-page="fiches">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Fiches</span>
            </li>
            <li data-page="graphe">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/><line x1="12" x2="12" y1="3" y2="9"/><line x1="12" x2="12" y1="15" y2="21"/></svg>
                <span>Graphe</span>
            </li>
            <li data-page="tickets">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7L12 13L2 7"/></svg>
                <span>Tickets</span>
            </li>
            <li data-page="profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profil</span>
            </li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Deconnexion</span>
            </button>
        </div>
    </nav>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="main-content">

        <!-- ===== PAGE RECHERCHE ===== -->
        <section id="page-search" class="page active">
            <header class="page-header">
                <h2>Recherche</h2>
                <div class="user-info">
                    <span id="usernameDisplay">Admin</span>
                </div>
            </header>

            <div class="search-tabs">

    <!-- ============ SCRIPTS ============ -->
    <script>
        console.log('Script chargé');

        // ============ SECTIONS TOGGLE ============
        document.querySelectorAll('.section-header').forEach(header => {
            header.addEventListener('click', function() {
                const body = this.nextElementSibling;
                const icon = this.querySelector('.toggle-icon');
                if (body) body.classList.toggle('open');
                if (icon) icon.classList.toggle('open');
            });
        });

        // ============ TABS ============
        document.querySelectorAll('.search-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.search-tab-content').forEach(c => c.classList.remove('active'));
                const tabId = this.dataset.tab;
                document.getElementById('tab-' + tabId).classList.add('active');
            });
        });

        // ============ TOAST ============
        function showToast(msg, type = 'info') {
            console.log('TOAST:', msg);
            const container = document.getElementById('toastContainer');
            if (!container) {
                alert(msg);
                return;
            }
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = msg + ' <button class="toast-close" onclick="this.parentElement.remove()">×</button>';
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 3000);
        }

        // ============ BOUTON RECHERCHE ============
        document.getElementById('searchBtn').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Recherche cliqué');
            showToast('Recherche en cours...', 'info');
        });

        // ============ BOUTON RECHERCHE PRO ============
        document.getElementById('searchBtnPro').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Recherche Pro cliqué');
            showToast('Recherche Pro en cours...', 'info');
        });

        // ============ BOUTON EFFACER ============
        document.getElementById('clearBtn').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Effacer cliqué');
            document.querySelectorAll('#tab-french input, #tab-french select').forEach(el => el.value = '');
            document.getElementById('searchResults').innerHTML = '';
            showToast('Formulaire efface');
        });

        // ============ BOUTON EFFACER PRO ============
        document.getElementById('clearBtnPro').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Effacer Pro cliqué');
            document.querySelectorAll('#tab-pro input, #tab-pro select').forEach(el => el.value = '');
            document.getElementById('searchResults').innerHTML = '';
            showToast('Formulaire Pro efface');
        });

        // ============ BOUTON LOOKUP ============
        document.getElementById('lookupBtn').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Lookup cliqué');
            const value = document.getElementById('lookupValue').value.trim();
            if (!value) {
                showToast('Veuillez entrer une valeur', 'warning');
                return;
            }
            showToast('Lookup en cours pour : ' + value, 'info');
        });

        // ============ BOUTON CREER FICHE ============
        document.getElementById('createFicheBtn').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Créer fiche cliqué');
            showToast('Création d\'une nouvelle fiche', 'info');
        });

        // ============ BOUTON NOUVEAU TICKET ============
        document.getElementById('openTicketBtn').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Nouveau ticket cliqué');
            showToast('Ouverture d\'un nouveau ticket', 'info');
        });

        // ============ BOUTONS GRAPHE ============
        document.getElementById('grapheAddPersonne').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Ajouter personne cliqué');
            showToast('Ajout d\'une personne au graphe', 'info');
        });
        document.getElementById('grapheAttacher').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Attacher cliqué');
            showToast('Attacher des personnes', 'info');
        });
        document.getElementById('grapheSauvegarder').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Sauvegarder graphe cliqué');
            showToast('Sauvegarde du graphe', 'info');
        });
        document.getElementById('grapheMesGraphes').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Mes graphes cliqué');
            showToast('Chargement des graphes', 'info');
        });
        document.getElementById('grapheEffacer').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Effacer graphe cliqué');
            showToast('Graphe efface', 'info');
        });

        // ============ LOGOUT ============
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Déconnexion cliqué');
            if (confirm('Se déconnecter ?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/';
            }
        });

        // ============ NAVIGATION ============
        document.querySelectorAll('.sidebar-nav li').forEach(item => {
            item.addEventListener('click', function() {
                const page = this.dataset.page;
                console.log('Navigation vers:', page);
                document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + page).classList.add('active');
            });
        });

        // ============ MOBILE MENU ============
        document.getElementById('mobileMenuBtn').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarBackdrop').classList.toggle('active');
        });
        document.getElementById('sidebarBackdrop').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('open');
            this.classList.remove('active');
        });

        // ============ PROFIL ============
        async function loadProfile() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.user) {
                        document.getElementById('profileInfo').innerHTML = `
                            <div class="profile-row"><span class="label">Nom</span><span class="value">${data.user.username}</span></div>
                            <div class="profile-row"><span class="label">Role</span><span class="value">${data.user.role}</span></div>
                            <div class="profile-row"><span class="label">Membre depuis</span><span class="value">${new Date(data.user.created_at).toLocaleDateString()}</span></div>
                            <div class="profile-row"><span class="label">Derniere connexion</span><span class="value">${data.user.last_login ? new Date(data.user.last_login).toLocaleString() : 'Jamais'}</span></div>
                        `;
                    }
                }
            } catch (e) {
                console.error('Profil error:', e);
            }
        }
        loadProfile();

        console.log('✅ Dashboard chargé avec succès');
    </script>
