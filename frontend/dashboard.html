<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marauder - Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.discordapp.com/attachments/1477415267452719208/1543881553220997240/favicon-32x32.png?ex=6a967b3e&is=6a9529be&hm=73725b0a8477c3d60cad60b87ea9d91bfbb90672f606b199b78e5e797d1cdb7b&">
    <link rel="shortcut icon" type="image/png" href="https://cdn.discordapp.com/attachments/1477415267452719208/1543881553220997240/favicon-32x32.png?ex=6a967b3e&is=6a9529be&hm=73725b0a8477c3d60cad60b87ea9d91bfbb90672f606b199b78e5e797d1cdb7b&">
    <style>
        /* ============================================
           RESET COMPLET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }
        
        body::before,
        body::after {
            display: none !important;
            content: none !important;
        }
        
        /* ============================================
           SIDEBAR
           ============================================ */
        .sidebar {
            width: 220px;
            background: #111111;
            border-right: 1px solid #2a2a2a;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            padding: 16px 12px;
            overflow-y: auto;
        }
        
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px;
        }
        
        .sidebar-header .logo {
            width: 28px;
            height: 28px;
            color: #ffffff;
        }
        
        .sidebar-header span {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }
        
        .sidebar-nav {
            list-style: none;
        }
        
        .sidebar-nav li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .sidebar-nav li:hover {
            background: rgba(255,255,255,0.03);
            color: #ffffff;
        }
        
        .sidebar-nav li.active {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }
        
        .sidebar-nav li svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        
        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
            margin-top: 12px;
        }
        
        .sidebar-footer button {
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }
        
        .sidebar-footer button:hover {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border-color: rgba(239,68,68,0.2);
        }
        
        .sidebar-footer button svg {
            width: 18px;
            height: 18px;
        }
        
        /* ============================================
           MAIN CONTENT
           ============================================ */
        .main-content {
            margin-left: 220px;
            padding: 32px 40px;
            background: #0a0a0a;
            min-height: 100vh;
        }
        
        /* ============================================
           PAGE
           ============================================ */
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        
        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }
        
        /* ============================================
           RECHERCHE
           ============================================ */
        .search-tabs {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 4px;
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }
        
        .search-tab {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }
        
        .search-tab.active {
            background: #ffffff;
            color: #000000;
        }
        
        .search-tab-content {
            display: none;
        }
        
        .search-tab-content.active {
            display: block;
        }
        
        .section {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
        }
        
        .section-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .section-body {
            padding: 0 20px 20px 20px;
            display: none;
        }
        
        .section-body.open {
            display: block;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0a0;
            margin-bottom: 6px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            border-color: #ffffff;
        }
        
        .search-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
        }
        
        .btn-primary {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary:hover {
            background: #cccccc;
        }
        
        .btn-secondary {
            background: transparent;
            color: #a0a0a0;
            border: 1px solid #2a2a2a;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }
        
        #searchBtn,
        #searchBtnPro {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #searchBtn:hover,
        #searchBtnPro:hover {
            background: #cccccc;
        }
        
        #clearBtn,
        #clearBtnPro {
            background: transparent;
            color: #a0a0a0;
            border: 1px solid #2a2a2a;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #clearBtn:hover,
        #clearBtnPro:hover {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }
        
        /* ============================================
           RESULTATS
           ============================================ */
        .result-card-full {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 12px;
        }
        
        .result-header-full {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px;
        }
        
        .result-name-full {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
        }
        
        .result-fields {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px 16px;
        }
        
        .result-fields.open {
            display: grid;
        }
        
        .result-field .field-label {
            font-size: 11px;
            font-weight: 500;
            color: #6b6b6b;
            text-transform: uppercase;
        }
        
        .result-field .field-value {
            font-size: 14px;
            color: #a0a0a0;
        }
        
        .result-field .field-value.highlight {
            color: #ffffff;
        }
        
        .result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
            margin-top: 12px;
        }
        
        .btn-deep {
            padding: 6px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-deep:hover {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }
        
        /* ============================================
           FICHES
           ============================================ */
        .fiche-item {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        
        .fiche-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .fiche-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .fiche-count {
            font-size: 12px;
            color: #6b6b6b;
        }
        
        .fiche-persons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .fiche-person {
            font-size: 13px;
            color: #a0a0a0;
            background: rgba(255,255,255,0.02);
            border: 1px solid #2a2a2a;
            padding: 2px 10px;
            border-radius: 4px;
        }
        
        .fiche-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #2a2a2a;
        }
        
        .fiche-btn {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #a0a0a0;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }
        
        .fiche-btn:hover {
            background: rgba(255,255,255,0.03);
            color: #ffffff;
        }
        
        /* ============================================
           MOBILE
           ============================================ */
        @media screen and (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                width: 280px;
                z-index: 1000;
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 16px 12px;
            }
            
            .page-header {
                padding-left: 48px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .search-actions {
                flex-direction: column;
            }
            
            .search-actions .btn-primary,
            .search-actions .btn-secondary,
            #searchBtn,
            #searchBtnPro,
            #clearBtn,
            #clearBtnPro {
                width: 100%;
                justify-content: center;
            }
            
            .lookup-form {
                flex-direction: column;
            }
            
            .result-header-full {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .result-fields.open {
                grid-template-columns: 1fr;
            }
        }
        
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #ffffff;
            padding: 8px 10px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
        }
        
        @media screen and (max-width: 768px) {
            .mobile-menu-btn {
                display: flex !important;
            }
        }
        
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        .sidebar-backdrop.active {
            display: block;
        }
    </style>
</head>
<body>
