<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marauder - Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

    <!-- ============ OVERLAY DE RECHERCHE ============ -->
    <div id="searchOverlay" class="search-loading">
        <div class="loading-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
            <span>Marauder</span>
        </div>
        
        <div class="thinking-text">
            <svg class="thinking-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
            </svg>
            Marauder réfléchit
            <span class="dot">.</span>
            <span class="dot">.</span>
            <span class="dot">.</span>
        </div>
        
        <div class="neon-bar-container">
            <div class="neon-bar"></div>
        </div>
        
        <div class="loading-text">Analyse en cours</div>
    </div>

    <nav class="sidebar">
        <div class="sidebar-header">
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
            <span>Marauder</span>
        </div>
        <ul class="sidebar-nav">
            <li class="active" data-page="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span>Recherche</span>
            </li>
            <li data-page="lookup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <span>Lookup</span>
            </li>
            <li data-page="history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>Historique</span>
            </li>
            <li data-page="profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profil</span>
            </li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Déconnexion</span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <!-- Page Recherche -->
        <section id="page-search" class="page active">
            <header class="page-header">
                <h2>Recherche</h2>
                <div class="user-info">
                    <span id="usernameDisplay"></span>
                </div>
            </header>

            <!-- Tabs -->
            <div class="search-tabs">
                <button class="search-tab active" data-tab="french">Recherche française</button>
                <button class="search-tab" data-tab="pro">Recherche Pro</button>
            </div>

            <!-- Tab Français -->
            <div id="tab-french" class="search-tab-content active">
                <div class="section">
                    <div class="section-header" data-section="identity">
                        <h3>Identité</h3>
                        <svg class="toggle-icon open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body open">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Nom</label>
                                <input type="text" id="searchNom" placeholder="Dupont">
                            </div>
                            <div class="form-group">
                                <label>Prénom</label>
                                <input type="text" id="searchPrenom" placeholder="Jean">
                            </div>
                            <div class="form-group">
                                <label>Nom de naissance</label>
                                <input type="text" id="searchNomNaissance" placeholder="Martin">
                            </div>
                            <div class="form-group">
                                <label>Nom affiché</label>
                                <input type="text" id="searchNomAffichage" placeholder="Jean Dupont">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" data-section="birth">
                        <h3>Naissance</h3>
                        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Jour</label>
                                <input type="number" id="searchJour" placeholder="15" min="1" max="31">
                            </div>
                            <div class="form-group">
                                <label>Mois</label>
                                <input type="number" id="searchMois" placeholder="6" min="1" max="12">
                            </div>
                            <div class="form-group">
                                <label>Année</label>
                                <input type="number" id="searchAnnee" placeholder="1990">
                            </div>
                            <div class="form-group">
                                <label>Date exacte</label>
                                <input type="date" id="searchDateNaissance">
                            </div>
                            <div class="form-group">
                                <label>Ville de naissance</label>
                                <input type="text" id="searchVilleNaissance" placeholder="Paris">
                            </div>
                            <div class="form-group">
                                <label>Genre</label>
                                <select id="searchGenre">
                                    <option value="">Tous</option>
                                    <option value="M">Homme</option>
                                    <option value="F">Femme</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" data-section="contact">
                        <h3>Contact</h3>
                        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="searchEmail" placeholder="jean@example.com">
                            </div>
                            <div class="form-group">
                                <label>Téléphone</label>
                                <input type="tel" id="searchPhone" placeholder="0612345678">
                            </div>
                            <div class="form-group">
                                <label>Nom d'utilisateur</label>
                                <input type="text" id="searchUsername" placeholder="jean_d">
                            </div>
                            <div class="form-group">
                                <label>Adresse IP</label>
                                <input type="text" id="searchIp" placeholder="192.168.1.1">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" data-section="location">
                        <h3>Localisation</h3>
                        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Adresse</label>
                                <input type="text" id="searchAdresse" placeholder="10 rue de la Paix">
                            </div>
                            <div class="form-group">
                                <label>Code postal</label>
                                <input type="text" id="searchCp" placeholder="75001">
                            </div>
                            <div class="form-group">
                                <label>Ville</label>
                                <input type="text" id="searchVille" placeholder="Paris">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" data-section="fivem">
                        <h3>FiveM / GTA RP</h3>
                        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Steam ID</label>
                                <input type="text" id="searchSteam" placeholder="steam:110000123456789">
                            </div>
                            <div class="form-group">
                                <label>FiveM License</label>
                                <input type="text" id="searchFivemLicense" placeholder="license:abc123...">
                            </div>
                            <div class="form-group">
                                <label>Discord ID</label>
                                <input type="text" id="searchDiscord" placeholder="834855528869265459">
                            </div>
                            <div class="form-group">
                                <label>Xbox Live (XBL)</label>
                                <input type="text" id="searchXbox" placeholder="xbl:2535423154...">
                            </div>
                            <div class="form-group">
                                <label>Live ID</label>
                                <input type="text" id="searchLive" placeholder="live:844425868261">
                            </div>
                            <div class="form-group">
                                <label>FiveM License2</label>
                                <input type="text" id="searchFivemLicense2" placeholder="license2:def456...">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" data-section="advanced">
                        <h3>Champs avancés</h3>
                        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>NIR (Sécu)</label>
                                <input type="text" id="searchNir" placeholder="1234567890123">
                            </div>
                            <div class="form-group">
                                <label>IBAN</label>
                                <input type="text" id="searchIban" placeholder="FR76...">
                            </div>
                            <div class="form-group">
                                <label>BIC</label>
                                <input type="text" id="searchBic" placeholder="BNPAFRPP">
                            </div>
                            <div class="form-group">
                                <label>VIN / Plaque</label>
                                <input type="text" id="searchVin" placeholder="AB-123-CD">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="search-actions">
                    <button id="searchBtn" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        Rechercher
                    </button>
                    <button id="clearBtn" class="btn-secondary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                        Effacer
                    </button>
                </div>
            </div>

            <!-- Tab Pro -->
            <div id="tab-pro" class="search-tab-content">
                <div class="section">
                    <div class="section-header" data-section="identity">
                        <h3>Identité</h3>
                        <svg class="toggle-icon open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body open">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Nom</label>
                                <input type="text" id="searchNomPro" placeholder="Dupont">
                            </div>
                            <div class="form-group">
                                <label>Prénom</label>
                                <input type="text" id="searchPrenomPro" placeholder="Jean">
                            </div>
                            <div class="form-group">
                                <label>Nom de naissance</label>
                                <input type="text" id="searchNomNaissancePro" placeholder="Martin">
                            </div>
                            <div class="form-group">
                                <label>Société</label>
                                <input type="text" id="searchSociete" placeholder="Entreprise SAS">
                            </div>
                            <div class="form-group">
                                <label>Profession</label>
                                <input type="text" id="searchProfession" placeholder="Développeur">
                            </div>
                            <div class="form-group">
                                <label>Fonction</label>
                                <input type="text" id="searchFonction" placeholder="CTO">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" data-section="contact">
                        <h3>Contact</h3>
                        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="searchEmailPro" placeholder="jean@entreprise.com">
                            </div>
                            <div class="form-group">
                                <label>Téléphone</label>
                                <input type="tel" id="searchPhonePro" placeholder="0612345678">
                            </div>
                            <div class="form-group">
                                <label>Adresse IP</label>
                                <input type="text" id="searchIpPro" placeholder="192.168.1.1">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header" data-section="pro-identifiants">
                        <h3>Identifiants uniques</h3>
                        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>SIRET</label>
                                <input type="text" id="searchSiret" placeholder="12345678901234">
                            </div>
                            <div class="form-group">
                                <label>SIREN</label>
                                <input type="text" id="searchSiren" placeholder="123456789">
                            </div>
                            <div class="form-group">
                                <label>NIR (Sécu)</label>
                                <input type="text" id="searchNirPro" placeholder="1234567890123">
                            </div>
                            <div class="form-group">
                                <label>IBAN</label>
                                <input type="text" id="searchIbanPro" placeholder="FR76...">
                            </div>
                            <div class="form-group">
                                <label>BIC</label>
                                <input type="text" id="searchBicPro" placeholder="BNPAFRPP">
                            </div>
                            <div class="form-group">
                                <label>VIN / Plaque</label>
                                <input type="text" id="searchVinPro" placeholder="AB-123-CD">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="search-actions">
                    <button id="searchBtnPro" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        Rechercher
                    </button>
                    <button id="clearBtnPro" class="btn-secondary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                        Effacer
                    </button>
                </div>
            </div>

            <div id="searchResults" class="results-container" style="margin-top:20px;"></div>
        </section>

        <!-- Page Lookup -->
        <section id="page-lookup" class="page">
            <header class="page-header">
                <h2>Lookup</h2>
            </header>
            <div class="lookup-form">
                <div class="form-group">
                    <label>Type d'identifiant</label>
                    <select id="lookupType">
                        <option value="email">Email</option>
                        <option value="phone">Téléphone</option>
                        <option value="iban">IBAN</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Valeur</label>
                    <input type="text" id="lookupValue" placeholder="jean.dupont@gmail.com">
                </div>
                <button id="lookupBtn" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    Lookup
                </button>
            </div>
            <div id="lookupResults" class="results-container"></div>
        </section>

        <!-- Page Historique -->
        <section id="page-history" class="page">
            <header class="page-header">
                <h2>Historique</h2>
            </header>
            <div id="historyList" class="results-container"></div>
        </section>

        <!-- Page Profil -->
        <section id="page-profile" class="page">
            <header class="page-header">
                <h2>Profil</h2>
            </header>
            <div id="profileInfo" class="profile-card"></div>
        </section>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
