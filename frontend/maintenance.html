<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Marauder - Maintenance en cours</title>
    <link rel="icon" type="image/png" href="hydra.png">
    <link rel="shortcut icon" type="image/png" href="hydra.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #050202;
            --text-1: #ffffff;
            --text-2: #a8a8a8;
            --text-3: #6a6a6a;
            --text-4: #3a3a3a;
            --red: #dc2626;
            --red-dark: #7f1d1d;
            --red-light: #f87171;
            --stroke-1: rgba(220,38,38,0.12);
            --stroke-2: rgba(220,38,38,0.25);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: var(--bg-deep);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           FOND : AURA ROUGE — style landing
           ============================================ */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(220,38,38,0.14), transparent 60%),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(127,29,29,0.1), transparent 60%),
                radial-gradient(ellipse 40% 30% at 15% 50%, rgba(220,38,38,0.05), transparent 70%),
                radial-gradient(ellipse 40% 30% at 85% 50%, rgba(127,29,29,0.05), transparent 70%);
            z-index: -3;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: -30%; left: 50%;
            transform: translateX(-50%);
            width: 1000px; height: 1000px;
            background: radial-gradient(circle, rgba(220,38,38,0.12), transparent 60%);
            filter: blur(80px);
            z-index: -2;
            pointer-events: none;
            animation: auraMove 12s ease-in-out infinite;
        }
        @keyframes auraMove {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
            50% { transform: translateX(-50%) scale(1.1); opacity: 1; }
        }

        /* ============================================
           GRILLE ANIMÉE
           ============================================ */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(220,38,38,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220,38,38,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* ============================================
           ORBES ROUGES
           ============================================ */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--red), transparent);
            top: -150px; left: -150px;
            animation: orbFloat1 15s ease-in-out infinite;
        }
        .orb-2 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, var(--red), transparent);
            bottom: -100px; right: -100px;
            animation: orbFloat2 18s ease-in-out infinite;
        }
        .orb-3 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, var(--red-light), transparent);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.08;
            animation: orbFloat3 12s ease-in-out infinite;
        }
        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, 50px) scale(1.1); }
            66% { transform: translate(50px, 100px) scale(0.9); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-80px, -60px) scale(1.15); }
            66% { transform: translate(-40px, -120px) scale(0.95); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.08; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.12; }
        }

        /* ============================================
           PARTICULES
           ============================================ */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(220,38,38,0.5);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* ============================================
           SCANLINE
           ============================================ */
        .scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(220,38,38,0.02) 50%);
            background-size: 100% 4px;
            z-index: 0;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* ============================================
           CONTAINER
           ============================================ */
        .container {
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* LOGO HYDRA */
        .logo-wrap {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-glow {
            position: absolute;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(220,38,38,0.6), transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: logoPulse 4s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.9; }
        }
        .logo-mark {
            position: relative;
            z-index: 1;
            width: 110px; height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logoFloat 4s ease-in-out infinite;
            filter:
                drop-shadow(0 0 40px rgba(220,38,38,0.8))
                drop-shadow(0 15px 40px rgba(0,0,0,0.9));
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .logo-mark img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ============================================
           BADGE
           ============================================ */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            background: rgba(220,38,38,0.08);
            border: 1px solid var(--stroke-2);
            border-radius: 24px;
            color: var(--red-light);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 24px;
            backdrop-filter: blur(4px);
        }
        .dot {
            width: 8px; height: 8px;
            background: var(--red);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(220,38,38,0.9);
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* ============================================
           TITRE
           ============================================ */
        h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleFade 4s ease-in-out infinite;
        }
        @keyframes titleFade {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        p {
            font-size: 17px;
            color: var(--text-2);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        /* ============================================
           BOUTON
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            border-radius: 12px;
            color: #000000;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s;
            margin-bottom: 48px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(255,255,255,0.12);
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(220,38,38,0.4), transparent);
            transition: left 0.6s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 36px rgba(220,38,38,0.4);
        }
        .btn:hover::before { left: 100%; }
        .btn svg { width: 20px; height: 20px; }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            padding-top: 24px;
            border-top: 1px solid var(--stroke-1);
            font-size: 13px;
            color: var(--text-3);
            position: relative;
        }
        .footer-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .footer-logo img {
            width: 22px; height: 22px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(220,38,38,0.6));
        }
        .footer-text { color: var(--text-3); font-size: 12px; }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-3);
            text-decoration: none;
            font-size: 12px;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--red-light); }
        .footer-links span { color: var(--text-4); font-size: 12px; }

        /* ============================================
           MOBILE
           ============================================ */
        @media (max-width: 768px) {
            h1 { font-size: 34px; }
            p { font-size: 15px; }
            .logo-mark { width: 90px; height: 90px; }
            .logo-wrap { width: 110px; height: 110px; }
            .logo-glow { width: 170px; height: 170px; }
            .btn { width: 100%; justify-content: center; }
            .orb { opacity: 0.14; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>
    <div class="scanlines"></div>

    <div class="container">
        <div class="logo-wrap">
            <div class="logo-glow"></div>
            <div class="logo-mark">
                <img src="hydra.png" alt="Marauder">
            </div>
        </div>

        <div class="badge">
            <div class="dot"></div>
            Maintenance en cours
        </div>

        <h1>Marauder</h1>
        <p>
            Le site est actuellement en maintenance.<br>
            Nous revenons très bientôt !
        </p>

            </svg>
            Rejoindre le Discord
        </a>

        <div class="footer">
            <div class="footer-logo">
                <img src="hydra.png" alt="Marauder">
                Marauder
            </div>
            <p class="footer-text">Plateforme OSINT / CSINT · Created by Index</p>
            <div class="footer-links">
                <a href="/cgu.html">CGU</a>
                <span>·</span>
                <a href="https://discord.gg/jf6QRZHaTB" target="_blank">Discord</a>
                <span>·</span>
                <span>© 2026 Marauder</span>
            </div>
        </div>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
            particle.style.animationDelay = (Math.random() * 10) + 's';
            particle.style.width = (Math.random() * 3 + 1) + 'px';
            particle.style.height = particle.style.width;
            particle.style.opacity = Math.random() * 0.5 + 0.2;
            if (Math.random() > 0.5) {
                particle.style.background = 'rgba(220,38,38,0.5)';
            } else {
                particle.style.background = 'rgba(255,255,255,0.3)';
            }
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
